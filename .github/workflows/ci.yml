name: CI

# `nix flake check` on each leg: every test suite under orc and refc, nph, and the spec checks
# (mirrors, pins, requirement ledger, coverage gate, oracle selftest) against the pinned specs.
# A second job runs the Nimble path from the same checkout so it cannot rot (R2), once per OS,
# memory manager and shard. A third runs it on Windows (A6, G334), where there is no Nix.
# Legs per R6: Linux x86_64, Linux aarch64 and macOS arm64 in the first two jobs, Windows x86_64
# in the third; Android and iOS join with M12.
# Each leg runs as parallel jobs, one per check group (flake.nix `ciGroups`): a single runner took
# over two hours for every check on Linux x86_64, and 86 of its 90 minutes on macOS (5bd731f,
# 2026-11-13). Each check is in exactly one group, and the first orc-spec shard also evaluates every
# flake output. Linux has six groups; macOS has no sanitizer checks, so only orc-spec, refc and
# orc-release. On Linux orc-spec runs as four shards, refc and orc-release as three, asan and
# tsan as four and msan as five (flake.nix `ciShards`, balanced by each check's minutes in a saved
# run, nix/ci-weights.json). A shard's heaviest check, when it takes 25 minutes or more, is its head:
# it builds on one build slot from the start and the rest beside it on three, since Nix starts a
# build's checks in no order of weight. On 0a459c9 (2026-11-21, run 44888184613) the x86_64 shards
# holding test_lcn_call under asan and msan, and orc-spec's holding kit-toolchains, passed the
# 90-minute limit when those checks started late; under asan and msan test_lcn_call alone still
# takes 80 and 73 minutes there. On b823baa (2026-11-25, run 45616293974) the two orc-release shards
# on x86_64 reached it too: the Package Manager's and the remote suites take 11 to 37 minutes each
# there.
# macOS builds orc-spec as three shards and refc and orc-release as two, without heads: on b823baa
# refc and orc-release, each whole, reached the 90-minute limit with 87 and 76 suites done, and
# orc-spec's two shards took 88 and 83 minutes. Its seven jobs and the nimble job's four share the
# five macOS runners a public repository has at once, so some wait for one; a job's timeout-minutes
# count from when it starts.
# The sanitizer jobs (asan, tsan, msan) have 150 minutes and every other job 90 (the nix job's
# `timeout-minutes`): on b823baa one suite alone takes up to 73 minutes there (test_logosd under
# asan on x86_64), so a shard holding it cannot be balanced under 90 by more shards. They do not
# fail the run between waves; the repository variable SANITIZERS_BLOCKING makes them block again
# (the nix job's `continue-on-error`).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the windows job (a trial of the Windows leg)
        type: boolean
        default: false
      nimble_only:
        description: Run only the jobs on the Nimble path, `nimble` and `windows` (a trial, G436)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    if: ${{ !inputs.windows_only && !inputs.nimble_only }}
    name: nix (${{ matrix.os }}, ${{ matrix.group }}${{ (matrix.os != 'macos-latest' && format(' {0}/{1}', matrix.shard, (matrix.group == 'msan' && 5) || ((matrix.group == 'refc' || matrix.group == 'orc-release') && 3) || 4)) || format(' {0}/{1}', matrix.shard, (matrix.group == 'orc-spec' && 3) || 2) }})
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        group: [orc-spec, refc, orc-release, asan, tsan, msan]
        # `ciShardCount` in flake.nix. On Linux: 4 for orc-spec, 3 for refc and orc-release, 4 for
        # asan and tsan and 5 for msan (the shards past 2 in `include`). On macOS: 3 for orc-spec
        # and 2 for refc and orc-release.
        shard: [1, 2]
        # flake.nix defines the sanitizer variants on Linux only.
        exclude:
          - os: macos-latest
            group: asan
          - os: macos-latest
            group: tsan
          - os: macos-latest
            group: msan
        include:
          - os: ubuntu-latest
            group: orc-spec
            shard: 3
          - os: ubuntu-24.04-arm
            group: orc-spec
            shard: 3
          - os: ubuntu-latest
            group: orc-spec
            shard: 4
          - os: ubuntu-24.04-arm
            group: orc-spec
            shard: 4
          - os: ubuntu-latest
            group: refc
            shard: 3
          - os: ubuntu-24.04-arm
            group: refc
            shard: 3
          - os: ubuntu-latest
            group: orc-release
            shard: 3
          - os: ubuntu-24.04-arm
            group: orc-release
            shard: 3
          - os: macos-latest
            group: orc-spec
            shard: 3
          - os: ubuntu-latest
            group: asan
            shard: 3
          - os: ubuntu-24.04-arm
            group: asan
            shard: 3
          - os: ubuntu-latest
            group: asan
            shard: 4
          - os: ubuntu-24.04-arm
            group: asan
            shard: 4
          - os: ubuntu-latest
            group: tsan
            shard: 3
          - os: ubuntu-24.04-arm
            group: tsan
            shard: 3
          - os: ubuntu-latest
            group: tsan
            shard: 4
          - os: ubuntu-24.04-arm
            group: tsan
            shard: 4
          - os: ubuntu-latest
            group: msan
            shard: 3
          - os: ubuntu-24.04-arm
            group: msan
            shard: 3
          - os: ubuntu-latest
            group: msan
            shard: 4
          - os: ubuntu-24.04-arm
            group: msan
            shard: 4
          - os: ubuntu-latest
            group: msan
            shard: 5
          - os: ubuntu-24.04-arm
            group: msan
            shard: 5
    runs-on: ${{ matrix.os }}
    # 150 minutes for a sanitizer group, 90 for the others (the header).
    timeout-minutes: ${{ contains(fromJSON('["asan", "tsan", "msan"]'), matrix.group) && 150 || 90 }}
    # The owner's decision of 2026-11-21: between waves the sanitizer groups do not block. A failed
    # asan, tsan or msan job still shows as failed, but the run succeeds, and planning triages each
    # run. For the end-of-tier sanitizer pass, set the repository variable SANITIZERS_BLOCKING to
    # `true` (Settings, Secrets and variables, Actions, Variables) and they block again; unset or
    # any other value leaves them non-blocking. orc-spec, refc and orc-release always block, as do
    # the nimble and windows jobs.
    continue-on-error: ${{ contains(fromJSON('["asan", "tsan", "msan"]'), matrix.group) && vars.SANITIZERS_BLOCKING != 'true' }}
    env:
      GROUP: ${{ matrix.group }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      # The cache's signing keys changed on 2026-11-19 (its /_api/v1/cache-config/<cache>
      # gives the current ones); the action still trusts only the old pair, so the new pair is
      # added here until it is updated. Drop these lines then.
      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-trusted-public-keys = public:zaDAOkd+E3cQyFm9J7qejQYd9HoLJc1SJvnk68hNWeI= ci:X+0FRwBzGnCKlopUJn2PR6xfiP2hnFAW90ruKaLumng=

      # The action adds cache.nix.logos.co as a substituter. When it does not answer (it timed
      # out from every runner on 2026-11-12), each nix command spends about two minutes on
      # retries before building without it. One probe decides for the whole job: if the cache
      # is down, later steps read from cache.nixos.org only (the runner user is a trusted Nix
      # user, so the daemon takes this override).
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      - name: Evaluate every flake output
        if: matrix.group == 'orc-spec' && matrix.shard == 1
        run: nix flake check --no-build

      # A shard with a head (flake.nix `ciLayout.<label>.head`, "" for none) builds it with one
      # build slot while its tail builds with the runner's other three, so the shard's longest
      # check starts with the job; a shard without one builds whole. Both builds run to the end,
      # and the step fails if either does.
      - name: Checks in group ${{ matrix.group }}
        run: |
          label="$GROUP-$SHARD"
          head=$(nix eval --raw ".#ciLayout.$label.head")
          if [ -z "$head" ]; then
            nix build -L --keep-going --no-link ".#ciShards.$label"
            exit
          fi
          echo "head of $label: $head"
          nix build -L --keep-going --no-link --max-jobs 1 ".#ciShardHeads.$label" &
          headPid=$!
          tailRc=0
          nix build -L --keep-going --no-link --max-jobs 3 ".#ciShardTails.$label" || tailRc=$?
          headRc=0
          wait "$headPid" || headRc=$?
          echo "head of $label: exit $headRc; tail: exit $tailRc"
          [ "$headRc" = 0 ] && [ "$tailRc" = 0 ]

  # One job per OS, Nimble test task and shard of the suites (`LCN_SHARD`, logos_core.nimble). Both
  # tasks in one Linux job passed 60 minutes on 2026-11-13 (orc 27 min, then refc); one job per task
  # took 49 and 51 minutes on 18b7867, almost all of it compiling suites one after another. Linux
  # runs three shards: on dc2e7ef (2026-11-16) its test_refc shards of two took 66 and 69 minutes.
  # macOS runs two (its test_refc shards took 44 and 46).
  nimble:
    if: ${{ !inputs.windows_only }}
    name: nimble (${{ matrix.os }}, ${{ matrix.task }}, ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 2 || 3 }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        task: [test, test_refc]
        shard: [1, 2]
        include:
          - os: ubuntu-latest
            task: test
            shard: 3
          - os: ubuntu-latest
            task: test_refc
            shard: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TASK: ${{ matrix.task }}
      # The shard count: macOS has `shard` 1 and 2, Linux also the 3 in `include`.
      LCN_SHARD: ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 2 || 3 }}
    steps:
      - uses: actions/checkout@v4

      # As in the nix job, the cache's new signing keys.
      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          extra-nix-config: |
            extra-trusted-public-keys = public:zaDAOkd+E3cQyFm9J7qejQYd9HoLJc1SJvnk68hNWeI= ci:X+0FRwBzGnCKlopUJn2PR6xfiP2hnFAW90ruKaLumng=

      # As in the nix job.
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      # [DECISIONS G436] The dev shell's Nimble is 0.26.2 (nix/nimble.nix), which fetches the package
      # list itself. Every command passes --useSystemNim, so Nimble neither installs nor locks a
      # Nim, and Nimble never compares the Nim on the path with `requires "nim == ..."`: this step
      # does, against logos_core.nimble's pin, before the first Nimble command.
      - name: The Nim on the path is logos_core.nimble's pin
        run: |
          pin=$(sed -n 's/^requires "nim == \([0-9.]*\)".*/\1/p' logos_core.nimble)
          have=$(nix develop -c nim --version | head -1)
          echo "pin: $pin; on the path: $have"
          case "$have" in
            "Nim Compiler Version $pin "*) ;;
            *) echo "::error::the Nim on the path is not logos_core.nimble's $pin"; exit 1 ;;
          esac

      # Regenerated from scratch, as the lock is made, and compared byte for byte. Once per OS.
      # No cache of ~/.nimble: a runner starts empty, so nothing an earlier run fetched or
      # installed decides this run's lock or packages.
      - name: nimble.lock matches logos_core.nimble
        if: matrix.task == 'test' && matrix.shard == 1
        run: |
          mv nimble.lock "$RUNNER_TEMP/nimble.lock"
          nix develop -c nimble --useSystemNim -y lock
          diff -u "$RUNNER_TEMP/nimble.lock" nimble.lock

      # Nix only supplies nim and nimble here; Nimble resolves and fetches the dependencies.
      - name: nimble setup
        run: nix develop -c nimble --useSystemNim setup -l

      # [DECISIONS G436] Nimble checks none of nimble.lock's checksums (draft #191). Each install
      # nimble.paths names must carry the lock's before anything in this job compiles against
      # them: the task below runs the same check first, but the peer check compiles directly.
      - name: Each install carries the checksum nimble.lock records
        run: nix develop -c nim r --hints:off tools/check_installs.nim

      - name: nimble ${{ matrix.task }}
        run: nix develop -c nimble --useSystemNim "$TASK"

      # G129: the caller's peer check against a listener another OS user created (TRANSPORT §8.2,
      # TRN-0190). It needs a throwaway user and passwordless sudo to it, so it runs only here;
      # elsewhere the test is skipped. In this job because the nix job's dev shell has no Nim
      # dependencies.
      - name: Peer check against another user's listener (G129)
        if: runner.os == 'Linux' && matrix.task == 'test' && matrix.shard == 1
        run: |
          sudo useradd --system --no-create-home lcnpeer
          echo "$USER ALL=(lcnpeer) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lcnpeer
          LCN_PEER_USER=lcnpeer nix develop -c nim c -r --outdir:build/tests/g129 \
            tests/test_transport_io.nim "trnio.peer*::*"

  # The Windows leg (A6, R6, G334): the Nimble path with its own toolchain, since there is no Nix
  # on Windows. Every step is `tools/ci/windows.ps1`, so a Windows machine runs the same commands
  # (5-4 proved each one on winvm.lan) and so can the repositories split from this one. The
  # toolchain is nim-lang.org's Nim 2.2.14 and its MinGW-w64 gcc 11.1.0, pinned by SHA-256 in the
  # script and checked after a cache hit as after a download. No nasm: nothing on Windows
  # assembles with it (BLAKE3's assembly goes through gcc; BoringSSL builds without assembly
  # there, 5-2). orc only: refc is covered on Linux and macOS (G123 as revised). The probes
  # (tools/winprobe, G107) run beside the suites on windows-2025 and alone on windows-2022, and
  # compare their facts with the committed ones for that build; they never fail the job. The leg
  # blocks since a run on master was green (44452740346 on 152fd1f; 5-4c, G123 as revised).
  windows:
    name: windows (${{ matrix.os }}, ${{ matrix.shard == 0 && 'probes' || format('{0}/4', matrix.shard) }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        # The 4 is the number of shards, here, in the name and in LCN_SHARD; 0 is the probes
        # alone. All 77 suites under orc took 161 minutes on winvm.lan (2 vCPUs; 69 compiling, 92
        # running); round-robin over four gives 32 to 48 minutes there per shard (5-4, I100).
        shard: [1, 2, 3, 4]
        include:
          - os: windows-2022
            shard: 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      LCN_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4

      - name: Cache the toolchain archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\lcn-toolchain\archives
          key: windows-toolchain-${{ hashFiles('tools/ci/windows.ps1') }}

      - name: Toolchain
        run: ./tools/ci/windows.ps1 toolchain

      - name: Cache the locked dependencies
        uses: actions/cache@v4
        with:
          path: nimbledeps/pkgs2
          key: windows-nimbledeps-${{ hashFiles('nimble.lock') }}

      - name: nimble setup
        run: ./tools/ci/windows.ps1 setup

      - name: Windows probes (informational)
        if: matrix.shard <= 1
        continue-on-error: true
        run: ./tools/ci/windows.ps1 probe

      - name: Keep the probes' facts
        if: matrix.shard <= 1 && always()
        uses: actions/upload-artifact@v4
        with:
          name: winprobe-facts-${{ matrix.os }}
          path: build/winprobe/facts/
          if-no-files-found: warn

      - name: nimble test
        if: matrix.shard != 0
        run: ./tools/ci/windows.ps1 test
