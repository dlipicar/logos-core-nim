name: CI

# `nix flake check` on each leg: every test suite under orc and refc, nph, and the spec checks
# (mirrors, pins, requirement ledger, coverage gate, oracle selftest) against the pinned specs.
# A second job runs the Nimble path from the same checkout so it cannot rot (R2), once per OS,
# memory manager and shard.
# Legs per R1: Linux x86_64, Linux aarch64, macOS arm64 until Tier 4 work starts.
# Each leg runs as parallel jobs, one per check group (flake.nix `ciGroups`): a single runner took
# over two hours for every check on Linux x86_64, and 86 of its 90 minutes on macOS (5bd731f,
# 2026-11-13). Each check is in exactly one group, and the orc-spec job also evaluates every flake
# output. Linux has six groups; macOS has no sanitizer checks, so only orc-spec, refc and
# orc-release.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix (${{ matrix.os }}, ${{ matrix.group }})
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        group: [orc-spec, refc, orc-release, asan, tsan, msan]
        # flake.nix defines the sanitizer variants on Linux only.
        exclude:
          - os: macos-latest
            group: asan
          - os: macos-latest
            group: tsan
          - os: macos-latest
            group: msan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The action adds cache.nix.logos.co as a substituter. When it does not answer (it timed
      # out from every runner on 2026-11-12), each nix command spends about two minutes on
      # retries before building without it. One probe decides for the whole job: if the cache
      # is down, later steps read from cache.nixos.org only (the runner user is a trusted Nix
      # user, so the daemon takes this override).
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      - name: Evaluate every flake output
        if: matrix.group == 'orc-spec'
        run: nix flake check --no-build

      - name: Checks in group ${{ matrix.group }}
        run: nix build -L --keep-going --no-link ".#ciGroups.$GROUP"

  # One job per OS, Nimble test task and shard of the suites (`LCN_SHARD`, logos_core.nimble). Both
  # tasks in one Linux job passed 60 minutes on 2026-11-13 (orc 27 min, then refc); one job per task
  # took 49 and 51 minutes on 18b7867, almost all of it compiling suites one after another.
  nimble:
    name: nimble (${{ matrix.os }}, ${{ matrix.task }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        task: [test, test_refc]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TASK: ${{ matrix.task }}
      # The 2 is the number of entries in `shard`.
      LCN_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}

      # As in the nix job.
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      # nimble 0.20.1 from the dev shell segfaults on macOS when it downloads the package list
      # itself (reproduced locally; Linux is unaffected), so the runner's curl fetches it: into
      # ~/.nimble for `nimble lock`, and into nimbledeps/ for the local-deps steps below.
      - name: Fetch the Nimble package list
        run: |
          curl -sfL --retry 3 -o "$RUNNER_TEMP/packages_official.json" \
            https://raw.githubusercontent.com/nim-lang/packages/master/packages.json
          mkdir -p ~/.nimble
          cp "$RUNNER_TEMP/packages_official.json" ~/.nimble/

      # Regenerated from scratch and before `nimble setup`: nimble 0.20.1 empties an existing lock
      # when run over it, and crashed when local deps were already installed. Once per OS.
      - name: nimble.lock matches logos_core.nimble
        if: matrix.task == 'test' && matrix.shard == 1
        run: |
          mv nimble.lock "$RUNNER_TEMP/nimble.lock"
          nix develop -c nimble -y lock
          diff -u "$RUNNER_TEMP/nimble.lock" nimble.lock

      # Nix only supplies nim and nimble here; Nimble resolves and fetches the dependencies.
      - name: nimble setup and ${{ matrix.task }}
        run: |
          mkdir -p nimbledeps
          cp "$RUNNER_TEMP/packages_official.json" nimbledeps/
          nix develop -c nimble setup -l
          nix develop -c nimble "$TASK"

      # G129: the caller's peer check against a listener another OS user created (TRANSPORT §8.2,
      # TRN-0190). It needs a throwaway user and passwordless sudo to it, so it runs only here;
      # elsewhere the test is skipped. In this job because the nix job's dev shell has no Nim
      # dependencies.
      - name: Peer check against another user's listener (G129)
        if: runner.os == 'Linux' && matrix.task == 'test' && matrix.shard == 1
        run: |
          sudo useradd --system --no-create-home lcnpeer
          echo "$USER ALL=(lcnpeer) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lcnpeer
          LCN_PEER_USER=lcnpeer nix develop -c nim c -r --outdir:build/tests/g129 \
            tests/test_transport_io.nim "trnio.peer*::*"
