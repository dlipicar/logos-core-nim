name: CI

# `nix flake check` on each leg: every test suite under orc and refc, nph, and the spec checks
# (mirrors, pins, requirement ledger, coverage gate, oracle selftest) against the pinned specs.
# A second job runs the Nimble path from the same checkout so it cannot rot (R2), once per OS,
# memory manager and shard. A third runs it on Windows (A6, G334), where there is no Nix.
# Legs per R6: Linux x86_64, Linux aarch64 and macOS arm64 in the first two jobs, Windows x86_64
# in the third; Android and iOS join with M12.
# Each leg runs as parallel jobs, one per check group (flake.nix `ciGroups`): a single runner took
# over two hours for every check on Linux x86_64, and 86 of its 90 minutes on macOS (5bd731f,
# 2026-11-13). Each check is in exactly one group, and the first orc-spec shard also evaluates every
# flake output. Linux has six groups; macOS has no sanitizer checks, so only orc-spec, refc and
# orc-release. On Linux each group runs as two shards, tsan as three, asan as four and msan as five
# (flake.nix `ciShards`, which balances them by the heaviest suites' measured times): on 36f355c
# (2026-11-14) the x86_64 asan and msan jobs passed the 90-minute limit and tsan took 81 minutes,
# on eed9d58 (2026-11-15) the second x86_64 msan shard of two did, on 5ddd886 (the same day) the
# second x86_64 asan shard of two did, on b3af640 (2026-11-16) the second x86_64 msan shard of three
# did (the other two took 72 and 71 minutes), and on 5887c5a (the same day) the second x86_64 tsan
# shard of two took 81 minutes, asan's second of three 74 and msan's four 55 to 68.
# macOS builds refc and orc-release whole and orc-spec as two shards: the whole orc-spec group took
# 49 minutes on 19a6274 (2026-11-15) and 73 on dc2e7ef (2026-11-16); refc took 52 to 60 in between.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the windows job (a trial of the Windows leg)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    if: ${{ !inputs.windows_only }}
    name: nix (${{ matrix.os }}, ${{ matrix.group }}${{ (matrix.os != 'macos-latest' && format(' {0}/{1}', matrix.shard, (matrix.group == 'msan' && 5) || (matrix.group == 'asan' && 4) || (matrix.group == 'tsan' && 3) || 2)) || (matrix.group == 'orc-spec' && format(' {0}/2', matrix.shard)) || '' }})
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        group: [orc-spec, refc, orc-release, asan, tsan, msan]
        # `ciShardCount` in flake.nix: 2, 3 for tsan, 4 for asan and 5 for msan (the shards past 2
        # in `include`).
        shard: [1, 2]
        # flake.nix defines the sanitizer variants on Linux only, and macOS builds refc and
        # orc-release whole.
        exclude:
          - os: macos-latest
            group: refc
            shard: 2
          - os: macos-latest
            group: orc-release
            shard: 2
          - os: macos-latest
            group: asan
          - os: macos-latest
            group: tsan
          - os: macos-latest
            group: msan
        include:
          - os: ubuntu-latest
            group: asan
            shard: 3
          - os: ubuntu-24.04-arm
            group: asan
            shard: 3
          - os: ubuntu-latest
            group: asan
            shard: 4
          - os: ubuntu-24.04-arm
            group: asan
            shard: 4
          - os: ubuntu-latest
            group: tsan
            shard: 3
          - os: ubuntu-24.04-arm
            group: tsan
            shard: 3
          - os: ubuntu-latest
            group: msan
            shard: 3
          - os: ubuntu-24.04-arm
            group: msan
            shard: 3
          - os: ubuntu-latest
            group: msan
            shard: 4
          - os: ubuntu-24.04-arm
            group: msan
            shard: 4
          - os: ubuntu-latest
            group: msan
            shard: 5
          - os: ubuntu-24.04-arm
            group: msan
            shard: 5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GROUP: ${{ matrix.group }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The action adds cache.nix.logos.co as a substituter. When it does not answer (it timed
      # out from every runner on 2026-11-12), each nix command spends about two minutes on
      # retries before building without it. One probe decides for the whole job: if the cache
      # is down, later steps read from cache.nixos.org only (the runner user is a trusted Nix
      # user, so the daemon takes this override).
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      - name: Evaluate every flake output
        if: matrix.group == 'orc-spec' && matrix.shard == 1
        run: nix flake check --no-build

      - name: Checks in group ${{ matrix.group }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ "$GROUP" != orc-spec ]; then
            attr="ciGroups.$GROUP"
          else
            attr="ciShards.$GROUP-$SHARD"
          fi
          nix build -L --keep-going --no-link ".#$attr"

  # One job per OS, Nimble test task and shard of the suites (`LCN_SHARD`, logos_core.nimble). Both
  # tasks in one Linux job passed 60 minutes on 2026-11-13 (orc 27 min, then refc); one job per task
  # took 49 and 51 minutes on 18b7867, almost all of it compiling suites one after another. Linux
  # runs three shards: on dc2e7ef (2026-11-16) its test_refc shards of two took 66 and 69 minutes.
  # macOS runs two (its test_refc shards took 44 and 46).
  nimble:
    if: ${{ !inputs.windows_only }}
    name: nimble (${{ matrix.os }}, ${{ matrix.task }}, ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 2 || 3 }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        task: [test, test_refc]
        shard: [1, 2]
        include:
          - os: ubuntu-latest
            task: test
            shard: 3
          - os: ubuntu-latest
            task: test_refc
            shard: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TASK: ${{ matrix.task }}
      # The shard count: macOS has `shard` 1 and 2, Linux also the 3 in `include`.
      LCN_SHARD: ${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && 2 || 3 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}

      # As in the nix job.
      - name: Skip the Logos cache when it does not answer
        run: |
          if ! curl -sf --retry 2 --connect-timeout 5 --max-time 10 -o /dev/null \
              https://cache.nix.logos.co/public/nix-cache-info; then
            echo "::warning::cache.nix.logos.co does not answer; reading from cache.nixos.org only"
            echo "NIX_CONFIG=substituters = https://cache.nixos.org/" >> "$GITHUB_ENV"
          fi

      # nimble 0.20.1 from the dev shell segfaults on macOS when it downloads the package list
      # itself (reproduced locally; Linux is unaffected), so the runner's curl fetches it: into
      # ~/.nimble for `nimble lock`, and into nimbledeps/ for the local-deps steps below.
      - name: Fetch the Nimble package list
        run: |
          curl -sfL --retry 3 -o "$RUNNER_TEMP/packages_official.json" \
            https://raw.githubusercontent.com/nim-lang/packages/master/packages.json
          mkdir -p ~/.nimble
          cp "$RUNNER_TEMP/packages_official.json" ~/.nimble/

      # Regenerated from scratch and before `nimble setup`: nimble 0.20.1 empties an existing lock
      # when run over it, and crashed when local deps were already installed. Once per OS.
      - name: nimble.lock matches logos_core.nimble
        if: matrix.task == 'test' && matrix.shard == 1
        run: |
          mv nimble.lock "$RUNNER_TEMP/nimble.lock"
          nix develop -c nimble -y lock
          diff -u "$RUNNER_TEMP/nimble.lock" nimble.lock

      # Nix only supplies nim and nimble here; Nimble resolves and fetches the dependencies.
      - name: nimble setup and ${{ matrix.task }}
        run: |
          mkdir -p nimbledeps
          cp "$RUNNER_TEMP/packages_official.json" nimbledeps/
          nix develop -c nimble setup -l
          nix develop -c nimble "$TASK"

      # G129: the caller's peer check against a listener another OS user created (TRANSPORT §8.2,
      # TRN-0190). It needs a throwaway user and passwordless sudo to it, so it runs only here;
      # elsewhere the test is skipped. In this job because the nix job's dev shell has no Nim
      # dependencies.
      - name: Peer check against another user's listener (G129)
        if: runner.os == 'Linux' && matrix.task == 'test' && matrix.shard == 1
        run: |
          sudo useradd --system --no-create-home lcnpeer
          echo "$USER ALL=(lcnpeer) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/lcnpeer
          LCN_PEER_USER=lcnpeer nix develop -c nim c -r --outdir:build/tests/g129 \
            tests/test_transport_io.nim "trnio.peer*::*"

  # The Windows leg (A6, R6, G334): the Nimble path with its own toolchain, since there is no Nix
  # on Windows. Every step is `tools/ci/windows.ps1`, so a Windows machine runs the same commands
  # (5-4 proved each one on winvm.lan) and so can the repositories split from this one. The
  # toolchain is nim-lang.org's Nim 2.2.14 and its MinGW-w64 gcc 11.1.0, pinned by SHA-256 in the
  # script and checked after a cache hit as after a download. No nasm: nothing on Windows
  # assembles with it (BLAKE3's assembly goes through gcc; BoringSSL builds without assembly
  # there, 5-2). orc only: refc is covered on Linux and macOS (G123 as revised). The probes
  # (tools/winprobe, G107) run beside the suites on windows-2025 and alone on windows-2022, and
  # compare their facts with the committed ones for that build; they never fail the job. The leg
  # blocks since a run on master was green (44452740346 on 152fd1f; 5-4c, G123 as revised).
  windows:
    name: windows (${{ matrix.os }}, ${{ matrix.shard == 0 && 'probes' || format('{0}/4', matrix.shard) }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        # The 4 is the number of shards, here, in the name and in LCN_SHARD; 0 is the probes
        # alone. All 77 suites under orc took 161 minutes on winvm.lan (2 vCPUs; 69 compiling, 92
        # running); round-robin over four gives 32 to 48 minutes there per shard (5-4, I100).
        shard: [1, 2, 3, 4]
        include:
          - os: windows-2022
            shard: 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      LCN_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4

      - name: Cache the toolchain archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\lcn-toolchain\archives
          key: windows-toolchain-${{ hashFiles('tools/ci/windows.ps1') }}

      - name: Toolchain
        run: ./tools/ci/windows.ps1 toolchain

      - name: Cache the locked dependencies
        uses: actions/cache@v4
        with:
          path: nimbledeps/pkgs2
          key: windows-nimbledeps-${{ hashFiles('nimble.lock') }}

      - name: nimble setup
        run: ./tools/ci/windows.ps1 setup

      - name: Windows probes (informational)
        if: matrix.shard <= 1
        continue-on-error: true
        run: ./tools/ci/windows.ps1 probe

      - name: Keep the probes' facts
        if: matrix.shard <= 1 && always()
        uses: actions/upload-artifact@v4
        with:
          name: winprobe-facts-${{ matrix.os }}
          path: build/winprobe/facts/
          if-no-files-found: warn

      - name: nimble test
        if: matrix.shard != 0
        run: ./tools/ci/windows.ps1 test
