# INTERFACE requirement units core implements (restructure step R9, row 35) that are checked by
# inspection rather than by a test. The spec's ledger, its main claims file and the SDK's items are in
# sdk/conformance/. Each item names the units and why no test can carry them; `spectrace gate` counts
# them as covered for core.

[[item]]
ids = ["IFC-0043"]
reason = "A permission for runtime, package and deployment records; no obligation follows. No such record exists in this repository yet (RUNTIME and PM are tiers 3-4), and acceptance recomputes every implemented-interface root from the supplied documents rather than reading one from a record (test [IFC-0038])."

# I-2.5-may (DECISIONS I88); split by package in R9, the kit's half in sdk/conformance/inspection/IFC.toml
[[item]]
ids = ["IFC-0666"]
reason = "IFC-0666 permits a terminal callback on the thread that detects the end, and the Runtime does not take it: engine.nim schedules a jkObserveEnd job and a lifecycle worker runs it (bindings.runEnd), never inside another binding operation (test [IFC-0656])."

# I-forced-termination (DECISIONS I88)
[[item]]
ids = ["IFC-0215"]
reason = "A permission about forced termination of an execution envelope, taken for hosted realizations only (DECISIONS I97 re-read it). A Module Host whose _MODULE_destroy outlives the stop deadline or the shutdown grace is ended by force, so destroy may not return (G269; tests S-10 and S-11 in tests/test_hosted.nim, S-24 in tests/test_hosted_permissions.nim). A direct realization shares the Runtime's process and has no envelope to terminate: its _MODULE_destroy past the deadline is recorded as cleanup-timeout and left to return, never interrupted (engine.nim stop and shutdown paths; tests [RUN-1072] in tests/test_engine.nim)."

# I-opaque (DECISIONS I88); split by package in R9, the C mapping's and the callers' half in sdk/conformance/inspection/IFC.toml
[[item]]
ids = ["IFC-0234", "IFC-0257", "IFC-0478"]
reason = "Negatives on an ABI caller holding module- or Runtime-owned opaque objects; no test can show that something is never done. IFC-0234: native.probeNative copies the _MODULE_call_surface() bytes into its own seq right after the call and never writes or frees the module's storage (test [IFC-0233] shows the same bytes every call). IFC-0257, IFC-0478: LogosModuleContext is an {.incompleteStruct.} with no fields (abi/types.nim), so Runtime code cannot dereference it; the realizer keeps each context only in its realization record and passes it back to that binding's own entries; instances are identified by instance-id strings in the engine and the store, and route handles are separate HandleState objects, so a context is never serialized, used as an identity or used as a routing handle."

# I-dispatch (DECISIONS I88)
[[item]]
ids = ["IFC-0247", "IFC-0248", "IFC-0492"]
reason = "MAYs on which provider entry an ABI caller uses. The Runtime always calls _MODULE_dispatch: invoke.callProvider for every routed call, synchronous or asynchronous (asynccall runs it on a call worker), and invoke.systemCall for the Capability Authority's evaluate (G48(a)). IFC-0248's permission is therefore taken on the deterministic-CBOR path, the only one in direct mode, and IFC-0247's and IFC-0492's are not: native.completeNative resolves and requires a provider binding's typed provider functions (test [RUN-0056]) but the Runtime never calls them. Only the test harness (sdk/tests/kit/typed_harness.c) calls typed provider functions (tests [IFC-0164], [IFC-0162])."

# I-no-transport (DECISIONS I88)
[[item]]
ids = ["IFC-0524"]
reason = "A negative over what crosses a Transport boundary (INTERFACE l.3960). The Runtime Control binding, the publish callback and their state (AttemptServices) live on the process's shared heap and are handed only to _MODULE_init in that process (bindings.fill). The transport I/O thread takes only IoCommand values: transport/io/api.nim checks at compile time that IoCommand and IoEvent hold no ref, ptr, pointer or proc, so none of them can be carried to a peer (DECISIONS I83, I90). A served invocation's context is built on the provider's side from its own session (runtime/served.nim, runtime/asynccall.nim newSessionCall)."

# I-marked-may (DECISIONS I88, I92)
[[item]]
ids = ["IFC-0574", "IFC-0582"]
reason = "A SHOULD and a MAY about buffers that hold a marked payload. IFC-0582: byte buffers of the Runtime, the transport and the Module Host that can hold a method payload (frame bodies, framed write copies, request and response copies, shared-heap copies, the caller's response copy) and the kit runtime's response blocks and call arenas are zeroed whether or not the payload is marked (DECISIONS G276; base/wipe.nim secureZero and freeWiped at each site). IFC-0574: encodeCbor sizes its output once and decodeCbor pre-sizes its containers (cbor), so no growth releases a partial copy; a route payload goes between the caller's process and the provider's directly, never through the carrier, so a hosted end adds the host's own copies only (DECISIONS G267; the carrier trace in tests [IFC-0575] W-7 of tests/test_wipe_routes.nim and P-13 of tests/test_hosted_routes.nim finds no pattern). No test can count copies a design avoided; the free scan of tests/test_wipe_routes.nim shows that none of those made is released unerased."

# I-ctx-concurrent-may (DECISIONS I88)
[[item]]
ids = ["IFC-0777"]
reason = "A permission for the module: it may run caller, is_cancelled and publish on one context concurrently while it holds the borrow. The Runtime's operations allow it: each admits itself through the invocation's entry guard (callside.enterGuard, leaveGuard), whose lock is held only to count the entry; callerOp reads identity fixed at the invocation's creation and isCancelledOp an atomic flag (invoke.nim), and publishOp delivers outside that lock. Whether a module uses the permission is its choice; current and caller from many threads at once are tested ([IFC-0771])."
