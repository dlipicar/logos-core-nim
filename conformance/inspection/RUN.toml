# RUNTIME requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.

[[item]]
ids = ["RUN-0718", "RUN-0752", "RUN-0754"]
reason = "Host Embedding API caller duties (§13.1, §13.4): valid memory for the common prefix, non-null NUL-terminated UTF-8 strings, memory valid for the call, live handles. What the library can check it does, in the order runtime/host.nim documents: null pointers first (test [RUN-0753]), then abi_version and struct_size before any other field (test [RUN-0719]); the one accepted configuration_format is an exact ASCII identifier, binding identifiers are checked as UTF-8 and symbol names as canonical ASCII names (native.checkStaticRegistration; test [RUN-1084]). A forged or stale handle is not detected (l.4065 permits that)."

[[item]]
ids = ["RUN-0722"]
reason = "A rule for later revisions of the §13 structures. logos_runtime.h carries the §13 and §13.3 text unchanged (lcn-gen logos-runtime from the mirrors RNT/13.host-handle.h and RNT/13.3.host-api.h; test [RUN-0716]), abi/host.nim has its exact layout (tests/test_abi.nim run.host-abi), and the library reads nothing past version 1's fields (test [RUN-0721])."

[[item]]
ids = ["RUN-0731", "RUN-0732", "RUN-0762"]
reason = "Host duties: serializing construction, registration, startup and destruction, and every call except request and wait. docs/HOST-CONFIG.md states them. runtime/host.nim stays safe when a host breaks the rule for request against start (reading R1, test [IMPL] R1) and keeps all handle state under one lock; destroy overlapping another call is not made safe."

[[item]]
ids = ["RUN-0735", "RUN-0743", "RUN-0750"]
reason = "Host duties: functions of the INTERFACE signature at the registered addresses, kept callable until successful destruction (l.4043, l.4058, and l.4054: 'signature correctness and code lifetime remain host preconditions'). docs/HOST-CONFIG.md states them. The library copies every table it keeps (test [RUN-0749]), so no borrowed binding memory is retained. The C module the tests register (tests/host/test_orchestrator.c) defines each symbol with the logos_types.h signature."

[[item]]
ids = ["RUN-0744"]
reason = "runtime/native.nim probeNative converts every resolved address to its INTERFACE signature (ModuleNameFn, ModuleInitFn, ModuleDestroyFn and the provider and per-method function types) before any call; the generic logos_runtime_symbol_address_t is kept only as an untyped pointer in the static table (StaticRegistration.symbols) and never called."

[[item]]
ids = ["RUN-1011", "RUN-1021"]
reason = "Negatives over runtime/engine.nim (DECISIONS I82). RUN-1011: execution for a retained origin is decided by a current authorization request at every attempt (execute: aaExecute with the origin as consumer; test [RUN-0692] in tests/test_recovery.nim), never inferred from the origin record being kept or its instance still being known, and retirement does not change that for anyone; this Runtime holds no intents for other Runtimes. RUN-1021: retireInst removes the instance record, keeps a tombstone and drops the instance's create_module keys, and nothing on that path uninstalls a package, revokes a grant, erases history, moves a state directory or hands an assignment or authority to another instance; the state directory surviving retirement is tested ([RUN-1020] in tests/test_recovery.nim)."

[[item]]
ids = ["RUN-0965", "RUN-0967"]
reason = "Documentation duties for list snapshots (DECISIONS I86). docs/HOST-CONFIG.md \"Observation\" states the finite capacity and retention limits (per consumer and in all, idle and absolute expiry, the page byte bound), the reclamation (expiry, the deadline timer, the end of the consumer's attempt, the consumer's own least recently used snapshot first) and the overload behavior (MODULE_ERROR, no other consumer's snapshot evicted). The values are runtime/plumbing.nim EngineLimits.effective; tests/test_observe.nim exercises each of them."

# R-f (DECISIONS I88)
[[item]]
ids = ["RUN-0528", "RUN-0581", "RUN-0582", "RUN-0941"]
reason = "Routing selection in Tier 4, where every provider is a local direct module instance with a provider record and no remote module facade exists. RUN-0528 (l.2887, a MAY): a provider address names the provider record of a local instance (runtime/routes.nim `record`: `target_provider` carries this Runtime's id and `instance` the backing instance); test [RUN-0557] 'a single route to a ready provider' in tests/test_routes.nim checks both. RUN-0941 (l.3124): with no facade nothing produces a continuation, so there is none to resolve: runtime/engine.nim `establish` returns only ready routes, and the same test checks an empty `continuations` array. RUN-0581 (l.3230, a MAY taken): selection policy is internal. `single` takes the first ready candidate whose record expects the contract, in creation order, unless the caller names a `provider` (`establish`). A new acquisition after a failure is an ordinary establish_route, so it may select another matching provider. No caller, host or deployment constraint on continuity exists beyond the `provider` selector. RUN-0582 (l.3230): no automatic re-acquisition exists, so its condition never holds. A failed route stays failed, and its consumer needs a new establish_route (test [RUN-0699] 'routes that failed with the previous realization stay failed' in tests/test_recovery.nim)."

# R-route-records (DECISIONS I88)
[[item]]
ids = ["RUN-0540"]
reason = "A MAY taken (l.2996). The engine keeps each route as a `Route` object owned by the Runtime thread (runtime/routes.nim: consumer, provider, selected contract, access, state, decision, pins). It builds the CDDL `route_record` (routes.nim `record`) only where a record is exposed: establish_route and renew_route responses, list_routes pages, route_state_changed events, and the host's `Engine.routes` view. An ordinary call through a handle is admitted against the `Route` object (runtime/engine.nim `admit`: `allowsMethod`, the terminal state, the call decision) and never encodes or consults a record. The externally observable lifecycle, authorization, revocation and error semantics are those tested in tests/test_routes.nim (establish, renew and close; 'a denied renewal revokes the route'; 'a stopped provider fails its routes') and tests/test_runtime_authority.nim (expiry and re-authorization)."

# R-e (DECISIONS I88)
[[item]]
ids = ["RUN-0555"]
reason = "A MAY taken (l.3124). The language binding is the Runtime Control binding's `materialize_route` (runtime/bindings.nim `rcMaterializeOp`). It materializes a ready route returned by establish_route or renew_route as a process-local `logos_route_handle_t` once runtime/engine.nim `materialize` has revalidated the route: owner, authority, readiness, terminal state and the expected contract root (INTERFACE §5.2). It defines no other acquisition operation. No Transport session is established, because only direct mode exists. Tests [IFC-0510] 'materialize a route and call the provider through it' and [IFC-0943] [IFC-0945] [IFC-0946] [IFC-0947] 'materialize_route failures' in tests/test_routes.nim show it."

# R-p (DECISIONS I88)
[[item]]
ids = ["RUN-0565", "RUN-0888", "RUN-0889"]
reason = "MAYs about failure reasons and codes, taken as follows. RUN-0565 (l.3157): a caller that may not tell an unknown target from a hidden or denied one gets the same NOT_AUTHORISED 'not authorised' (runtime/engine.nim `establish`, `localTarget`). Meanwhile the Runtime keeps each authorization answer with its source, decision id, outcome and the authority's denial code (runtime/authz.nim; docs/HOST-CONFIG.md 'What the Runtime retains about decisions'; test [RUN-0331] 'a deny is NOT_AUTHORISED; the retained answer keeps its consumer, operation, target, decision id and denial code' in tests/test_runtime_authority.nim), and the authority keeps its own audit. RUN-0888 (l.2520): a route records the code of its first terminal transition only (runtime/routes.nim `terminate`). In direct mode the retained audit rules (l.3254-3263) need one distinction, an authority denial against an inability to obtain a decision, and the retained answers keep it (test [RUN-0326] 'an evaluation failure fails closed and is recorded apart from a deny' in tests/test_engine.nim). RUN-0889 (l.2520): every route termination uses a defined code (the `endRoute` callers in runtime/engine.nim: provider-unavailable, consumer-unavailable, authority-denied, authority-revoked, authority-expired, authority-evaluation-failed). `other` is used only for module failures that match no defined classification: an error of the bootstrap mechanism other than a failed init while it realizes the Module Loader instance (runtime/engine.nim `bootstrapFailure`; G57), a Module Loader call that fails or answers invalidly (G252), an instance orphaned by its Module Loader's failure (G246), and an unclean end (G193). A typed Module Loader error is `loader-<code>` (test [RUN-1053] in tests/test_loader_engine.nim). No implementation-specific code is produced (runtime/plumbing.nim `FailureKind`)."

# R-d (DECISIONS I88)
[[item]]
ids = ["RUN-0638"]
reason = "No package input reaches the Runtime in Tier 4 (G55). Records are direct_static bindings or direct_dynamic artifacts from the host configuration or a create_module declaration, and runtime/ has no package manifest, installed inventory or version requirement. runtime/engine.nim `summary` builds `selection` from the record's direct strategy (`direct_static` or `direct_dynamic`), or `implementation-specific` for the Module Loader instance, which the bootstrap mechanism realizes (G57), and never sets `package` or `signer`, so the Runtime reports no package identity, let alone an inferred one. Test [RUN-0637] [RUN-0639] 'a ready instance: one committed view, a current realization, its strategy as the selection' in tests/test_observe.nim checks that `package` and `signer` are absent; test [RUN-0639] [IMPL-DECISION G57] in tests/test_loader_engine.nim checks the Loader's own selection."

# R-o (DECISIONS I88)
[[item]]
ids = ["RUN-0707", "RUN-1077", "RUN-1078"]
reason = "Shutdown in direct mode (§10.2). RUN-0707 (l.3857, a MAY not taken): every realization is a shared-process native one, which l.3838 forbids force-releasing, so none is forced. When the shutdown grace passes, runtime/engine.nim `checkDeadlines` records `cleanup-timeout` and shutdown completes with the context untouched until its destroy returns. The outcome names the unresolved instances (`shutdownOutcome`; G60, G180). Test [RUN-1072] [RUN-1073] 'a destroy that outlives the shutdown grace is recorded, not forced' in tests/test_engine.nim shows this. RUN-1077 (l.3863): admission closes at `beginShutdown` (`admit` and `subscribe` refuse with NOT_READY once shutting down), but no discharge path is gated. `releaseHandle`, asynchronous-call terminal and deferred events with the request_cancel jobs they dispatch (`asyncEvent`), and call-completion and destroy messages are all handled on the Runtime thread whether or not shutdown has begun. A provider's release waits for admitted calls and execution release before destroy (`releaseRealization`; test [IFC-0768] 'stopping the provider waits for execution release before destroy' in tests/test_async.nim). RUN-1078 (l.3863): the only system service in Tier 4 is the Capability Authority, and no cleanup step needs it. `shutdownStep` stops instances without an authorization request. Parked operations are answered NOT_READY when shutdown begins (`failOutstanding`; test [I85] 'shutdown answers parked operations NOT_READY and begins no evaluation' in tests/test_runtime_authority.nim). A binding lost during shutdown releases nothing (`loseBinding` returns once the cache is cleared). Unresolved cleanup stays owned and is reported (`shutdownOutcome`)."

# R-j (DECISIONS I88)
[[item]]
ids = ["RUN-0711", "RUN-0712", "RUN-1080", "RUN-1081", "RUN-1082", "RUN-1083"]
reason = "§11 and §12. No presentation profile is selected and nothing in src/ defines one. A presentation module would be an ordinary instance with the one lifecycle, routing and authority path every module has (runtime/engine.nim `Inst`, `start`, `establish`), so no separate presentation participant, identity, lifecycle or authority path exists (RUN-0711) and no profile has to preserve the contract (RUN-0712). No profile transfers a user-selected resource capability (RUN-1080). Authorization never reads an ordinary payload. Every `AuthzRequest` is built from the authenticated consumer, the route and Runtime-owned records (`establish`, `admit`), and payload bytes are only validated and committed, so a path or descriptor in a payload is never treated as authority (RUN-1081; HC-08). RUN-1082 and RUN-1083 bind contracts and providers. No contract this repository ships takes a filesystem path in an ordinary payload. The Capability Authority contract has none. Runtime Control's `logos.runtime_control.path` appears only in remote runtime addresses and the local invocation descriptor, neither of which direct mode uses: connect_remote is NOT_AUTHORISED (test [RUN-0043]) and routes carry no `invocation` (test [RUN-0406]). Each payload contract that takes a path will state its namespace and failure when its module is ported (G99, re-decided 2026-11-11)."

# R-facts (DECISIONS I88)
[[item]]
ids = ["RUN-0865"]
reason = "Evaluation is externalized only under the `capability-authority` policy. Acquisition follows G47 (re-decided 2026-11-11): the facts come from the engine's own registry, never from a caller or the host. `putFacts` gives the attribute source an instance's id, module name and provider before anything can name it (runtime/engine.nim `createInst`, and `restore` after a restart; docs/HOST-CONFIG.md 'The attribute source'). Freshness: a direct instance's module name is immutable for its life (RUNTIME l.3546, l.3621), so its one transition is retirement. There `dropFacts` removes the facts and drops every cached decision that names the instance as consumer or target (runtime/dcache.nim `dropInstance`). Missing facts are an evaluation failure, never a deny, and the next evaluation sees a facts change (CA-side tests [CAP-0098] and [CAP-0279] in tests/test_authority.nim). Policy and grant changes invalidate cached decisions in order with admissions (test [CAP-0184] [CAP-0185] in tests/test_runtime_authority.nim). Test [RUN-0185] in tests/test_host_authority.nim runs a policy whose subjects name modules, which only these facts can match."

# R-settings (DECISIONS I88)
[[item]]
ids = ["RUN-0890", "RUN-0891", "RUN-0894", "RUN-0895", "RUN-0911", "RUN-0912", "RUN-0913", "RUN-0915", "RUN-0916", "RUN-0917"]
reason = "Permission settings have the constant form of G229 (runtime/engine.nim `permissionSettings`). Every local instance answers revision 1, an empty permission array and `applied`, with no failure. A replacement naming any permission is INVALID_PARAMS without detail ('no permission definition is known to this Runtime', RUNTIME l.2536), a stale revision is INVALID_PARAMS, and `[]` at revision 1 returns the existing state (l.2584). Nothing is stored and no replacement is ever accepted, so the reconciliation rules have nothing to act on. No application can fail, so `enforcement-failed` is never produced (RUN-0890). No execution failure is ever encoded as a permission-enforcement failure, because `permission-enforcement-failed` in runtime/plumbing.nim `FailureKind` is never produced (RUN-0891). There is no widening or narrowing to reconcile, no mechanism to choose and no access to widen (RUN-0911, RUN-0912, RUN-0913). No stop is caused by settings reconciliation, so no retained intent is resumed for one (RUN-0915). No replacement is reported `applied` (RUN-0916), and `pending` never occurs (RUN-0917). The initial settings come from no input: the protected-provisioning MAY is not taken, and `permissionSettings` reads neither the record's `requested_permissions` nor its declaration (RUN-0894). Restoration preserves the settings because they are a constant of this Runtime, the same before and after a restart (RUN-0895). Tests [RUN-0893] [RUN-0910] [RUN-0469] 'every local instance has its settings at revision 1, empty and applied' and [RUN-0474] [RUN-0475] [RUN-0892] 'an empty replacement at revision 1 returns that state; ...' in tests/test_observe.nim show the constant form. `permission_settings_changed_event` is never produced (docs/HOST-CONFIG.md, 'Runtime Control subscriptions')."

# R-l (DECISIONS I88)
[[item]]
ids = ["RUN-0906", "RUN-0907"]
reason = "`get_execution_permissions` always answers `unavailable` (runtime/engine.nim `rc`, the `rmGetExecutionPermissions` branch; the plan's engine.nim l.1558-1565 is out of date). Direct mode installs no operating-system permission enforcement (permission profiles and enforcers are deferred:tier-4b under G110), so there is no enforced snapshot, and RUNTIME l.2574 then requires `unavailable` rather than an empty array. The `available` arm is never built, so its completeness (RUN-0906) and its derivation from retained enforcement state (RUN-0907) never arise. Nothing on that path reads module declarations, `requested_permissions`, the permission settings or an authority decision. Test [RUN-0908] [RUN-0909] 'get_self and get_execution_permissions are caller-bound' in tests/test_routes.nim shows the `unavailable` answer."

# R-m (DECISIONS I88)
[[item]]
ids = ["RUN-0940", "RUN-1064"]
reason = "Deployment documentation in docs/HOST-CONFIG.md. RUN-1064 (l.3774-3775): 'Persistent Runtime state', item 'Resumption after a restart, and retries after a failure', makes the distinction. At start the Runtime resumes only the orchestration instance (G191), and that resumption counts as no restart attempt; a restart policy counts the recover_module calls made after a failure while the Runtime runs, and an episode still open when the Runtime ended continues charged (G193 as amended, G289). 'The reference orchestration module', item 'Resumption is not a retry', says how the module that does this tells the two apart (I94; its tests tag RUN-1064), and 'Orchestration duties' lists the reconciliation and restart-policy duties a host that names another module carries (l.3774-3776, l.3786-3790). RUN-0940 (l.3034): 'Under capability-authority', item 'Time assurance', documents the assurance the authority policy needs. The host's wall clock is trusted for `valid_until`, and each validity is also held on a monotonic clock fixed at receipt, so a backward step never extends authority and a forward step ends it early; there is no skew tolerance. Time-dependent operations fail closed on either clock: at `expires_at` a route is revoked with authority-expired (test [RUN-0550]), and a backward wall-clock step does not extend a cached decision (test [RUN-0939]), both in tests/test_runtime_authority.nim. The internal `allow-all` policy issues no time-bound decisions, and no certificate policy exists in Tier 4."

# R-q (DECISIONS I88)
[[item]]
ids = ["RUN-0983", "RUN-1055"]
reason = "Obligations on observers and consumers of Runtime Control, not on the Runtime. The Runtime's side is built and tested: a hint for every committed change an observer may see (tests [RUN-0977] [RUN-0978] in tests/test_rcevents.nim), a subscription that is lost when its handler falls behind (G225), and an unknown failure code kept by decoding (test [RUN-0886] in tests/test_rc_schema.nim). docs/HOST-CONFIG.md states the duties for the modules that consume these. 'Runtime Control subscriptions' says an observer that cannot be sure it saw every event must query list_modules, list_routes and get_execution_summary and resubscribe, periodically when it cannot rule out a loss (RUN-0983, l.3425-3428). 'Orchestration duties' (item 'Failure classifications') and 'Observation' (item 'Failure text') say a consumer must treat an unrecognized classification as an unspecified failure and never derive a restart policy from its spelling (RUN-1055, l.3756). The reference orchestration module is such a consumer (I94): it re-reads and resubscribes every resync_ms and decides from no failure classification but cleanup-timeout ('The reference orchestration module'); its tests tag both (tests/test_orchestration.nim, tests/test_orch_policy.nim)."

# R-createkeys (DECISIONS I88)
[[item]]
ids = ["RUN-1029"]
reason = "Conditional on a MAY not taken (l.3626-3627): the association is discarded at retirement. runtime/engine.nim `retireInst` drops the retired instance's create_module keys in the same durable write (see the existing inspection item for RUN-1011 and RUN-1021), so no association outlives its instance, and a later request with the key is a new creation (test [RUN-1028] 'after retirement the key creates a new instance' in tests/test_recovery.nim). While the instance is known, `createModule` answers a replay from the key record alone, its module and instance id, without consulting the instance's state (test [RUN-0660] [RUN-0661] [RUN-0662] 'a key replays its instance unchanged, and only for its module')."

# R-g (DECISIONS I88)
[[item]]
ids = ["RUN-0218", "RUN-0238", "RUN-0818", "RUN-0828"]
reason = "Scheduling is Runtime-internal (RUNTIME §6.1, §7.1, §7.3.1). RUN-0218, a negative over the ABI: logos_types.h carries the INTERFACE §5.2 block verbatim (test [IFC-0603] [IFC-0934] in tests/test_codegen.nim) and no init-input, binding or vtable field names a worker pool, event loop or entry thread; the lifecycle, call, evaluation and event workers are runtime/plumbing.nim constants (MaxWorkers, MaxCallWorkers, MaxNestedWorkers, MaxNestedCallWorkers, MaxEventWorkers) no module sees, and a synchronous call or publication runs on the caller's thread (test [IFC-0279] in tests/test_events.nim). RUN-0238, a MAY not taken: the Host Embedding API (logos_runtime.h, runtime/host.nim) has no event-loop hook; the Runtime thread and its workers belong to the library. RUN-0818 is an umbrella over the ordering, concurrency, cancellation and failure rules of RUNTIME §6 and §7.3-§7.5 and INTERFACE §2.8-§2.9, each tagged on its own tests (tests/test_async.nim, tests/test_events.nim, tests/test_routes.nim, tests/test_kit.nim concurrency); scheduling adds no rule of its own a test could show. RUN-0828, a negative: a scoped publication's recipients are chosen by runtime/engine.nim `scoped` from the invocation's route and path generation alone (`s.generation == q.generation and s.eventName == q.bare`); nothing reads a payload field or a caller value to select a recipient (test [RUN-0821] [RUN-0825] [RUN-0826] in tests/test_events.nim: only subscriptions on the calling handle receive)."

# R-h (DECISIONS I88)
[[item]]
ids = ["RUN-0250", "RUN-0251", "RUN-0252", "RUN-0253"]
reason = "Module duties (RUNTIME §7.4) that every lcn-gen kit module meets; no test can observe a module not retaining or not dereferencing a pointer. codegen/kitrt.nim `kitInit` copies `runtime_control`, `publish`, `publish_user_data` and `invocation_access` into the context's ModuleServices (RUN-0250, the MAY taken), copies the state directory and configuration, and keeps no pointer to the input (RUN-0251; test [IFC-0217] [IFC-0218] [IFC-0219] in tests/test_kit.nim shows the copies). `publishEncoded` passes `publishUserData` back unchanged as the callback's first argument (RUN-0252), and the kit never dereferences, compares, encodes or stores it elsewhere: the ModuleServices fields `publishFn` and `publishUserData` are not exported, so author code cannot reach them (RUN-0253). Engine tests that receive a kit module's event (test [RUN-0244] [RUN-0245] [IFC-0184] in tests/test_events.nim) depend on the unchanged pointer, since runtime/events.nim `publishOp` casts it back to the attempt's services."

# R-outbound (DECISIONS I88)
[[item]]
ids = ["RUN-0255"]
reason = "A negative over runtime/engine.nim and runtime/bindings.nim (RUNTIME §7.5 l.1331). Every request a module makes carries the origin and attempt of the binding or handle it came through (bindings.nim `newAttemptServices`; a handle's `consumer`), never an inbound invocation's. engine.nim `establish` authorizes the Runtime Control binding's own instance as consumer (G52); `admit` refuses a route whose consumer is not the caller's instance and decides `aaCall` for `r.consumer` on `r.id`; direct mode has no route ticket, and no request field can name an inbound route or decision. A provider's outbound call is therefore decided like any other call of that instance: test [RUN-0866] [RUN-0188] in tests/test_routes.nim (the per-call decision is the calling consumer's) and test [IFC-0510] [IFC-0491] [RUN-0866] [RUN-0152] (the provider sees the consumer as its caller) show the two sides. The plan's hint (8b A-cases) does not hold: no 8b test makes a call from inside a provider entry, and no fixture module does."

# R-decl (DECISIONS I88)
[[item]]
ids = ["RUN-0269", "RUN-0848"]
reason = "requested_permissions are kept and read by nothing that decides. runtime/records.nim `checkRecord` validates them and runtime/store.nim keeps them as accepted (test [RUN-0486] ... [IMPL-DECISION G160] in tests/test_persist.nim: the retained record stays byte-equal); no other code reads ModuleRecord.requestedPermissions. RUN-0269: Runtime never presents them to active policy in Tier 4: an AuthzRequest (runtime/authz.nim) has no permission field, the execution decision carries no permission scope (G217, runtime/authscopes.nim), and the Capability Authority's attribute source holds only the module name and selection (authority/facts.nim InstanceFacts), so the condition 'when presenting them' never arises; the plan's hint (8b A-cases) cannot show it. RUN-0848: a state assignment comes only from the protected record's `state_assignment` or a declaration's `persistent_state` (docs/HOST-CONFIG.md), never from a requested permission, and no authorization reads one. The plan put RUN-0848 in R-d (no package input reaches the Runtime), which does not cover a direct record's declarations."

# R-b (DECISIONS I88)
[[item]]
ids = ["RUN-0285"]
reason = "The engine never reinterprets realization fields (RUNTIME l.1519). The Runtime sends the Module Loader a realize request built from the record (runtime/records.nim `descriptor`: strategy, module, binding, artifact; with the state assignment and the configuration input, runtime/loaderbinding.nim `realizeBytes`) and takes back a realization record and a call surface, which runtime/loaderbinding.nim `readReply` and `acceptSurface` check against the request before engine.nim applies anything on the Runtime thread (I75). An AuthzRequest (runtime/authz.nim) has no field for a strategy, binding, artifact or state assignment, so none is an authorization input; an artifact digest is integrity evidence only (test [RUN-0137] [RUN-0131] in tests/test_realizer.nim); lifecycle states are set by engine.nim's own transitions, never copied from the Loader's record (a typed Loader error is classified `loader-<code>`: test [RUN-1053] in tests/test_loader_engine.nim; a response that does not match the request fails the Loader: test [IMPL-DECISION G252] 'an invalid realize response fails the Loader…' in tests/test_loader_engine.nim)."

# R-e (DECISIONS I88)
[[item]]
ids = ["RUN-0294", "RUN-0842"]
reason = "RUN-0294 is a module duty (RUNTIME §8.1 l.1564) met by the kit as in R-h: codegen/kitrt.nim `kitInit` copies the Runtime Control binding and the event-publication fields into the context and retains no pointer to `logos_module_init_input_t` (test [IFC-0217] [IFC-0218] [IFC-0219] in tests/test_kit.nim); a module that keeps the pointer cannot be detected by a test. RUN-0842 is a MAY not taken: lcn-gen calls (codegen/callsgen.nim, callrt.nim) emits synchronous typed helpers only; asynchronous calls go through the route handle's generic prepare_call, submit and release (INTERFACE §2.9; tests/test_async.nim), so no provider's typed signature changes."

# R-attr (DECISIONS I88)
[[item]]
ids = ["RUN-0323"]
reason = "A MAY taken (RUNTIME l.1690; G47). Under the capability-authority policy, runtime/engine.nim `putFacts` writes each instance's module name into the Capability Authority's protected attribute source (authority/facts.nim SharedFacts, with the execution selection when known) before the instance is exposed, from the engine's own registry, and `dropFacts` removes it at retirement; no attribute is taken from a request (CAP-0276), and an attribute never authorizes alone, since every operation still needs an allow decision. tests/test_authority.nim [CAP-0274] [CAP-0275] [CAP-0276] [CAP-0277] [CAP-0091] ('subjects match the facts, never the scope's fields') and [CAP-0279] ... ('a facts change is seen by the next evaluation') show the authority's use of them."

# R-order (DECISIONS I88)
[[item]]
ids = ["RUN-0349", "RUN-0351"]
reason = "RUN-0349: every mutation is applied on the one Runtime thread (DECISIONS I75), which handles one request at a time in arrival order, and an invocation is answered only after its mutation is committed (and stored first, RUN-0631); an invocation that completed before another began was therefore applied first. No test can show the absence of a reordering beyond what test [RUN-0361] [RUN-0362] [RUN-0363] in tests/test_engine.nim shows (strictly increasing serials and revisions over sequential operations). RUN-0351, a MAY taken in part: the mutations themselves are serialized on that thread, while the work for independent targets runs concurrently on workers: initialization and destruction on lifecycle workers, calls on call workers (runtime/plumbing.nim; test [IFC-0712] [IMPL-DECISION G242] in tests/test_async.nim holds 70 calls in one provider at once)."

# R-settings (DECISIONS I88)
[[item]]
ids = ["RUN-0476", "RUN-0477", "RUN-0478", "RUN-0479", "RUN-0480", "RUN-0482"]
reason = "Permission settings have G229's constant form (plan C.3). runtime/engine.nim `permissionSettings` answers revision 1, no permission, `applied` and no failure for every local instance; `update_permission_settings` returns that state for an empty array at revision 1, refuses every other request with INVALID_PARAMS without detail (a non-empty array names an unknown definition, RUNTIME l.2536; another revision is stale) and stores nothing. No replacement is ever accepted, so no request can reach the units that follow an accepted replacement: a retry of failed settings (RUN-0476), saving a new replacement (RUN-0477), reconciliation and recovery after restart (RUN-0478), an enforcement failure and what it may not restore (RUN-0479, RUN-0480), and the delivery rule of `permission_settings_changed_event` (RUN-0482), which nothing produces (runtime/rcevents.nim `rePermissionSettings` is accepted for subscription only: test [IFC-0174] ... in tests/test_rcevents.nim). Tests of the constant form: tests/test_observe.nim suite 'permission settings in direct mode' ([RUN-0893] ..., [RUN-0474] ..., [RUN-0473] ...)."

# R-cfg (DECISIONS I88)
[[item]]
ids = ["RUN-0483"]
reason = "An umbrella over LOGOS-MODULE-CONFIGURATION (RUNTIME l.2606). The five configuration methods and `configuration_state_changed_event` are built to that specification (DECISIONS I87), which is claimed in full (conformance/claims/CFG.toml, default `claimed`) and covered unit by unit by [CFG-...] tags in tests/test_config.nim, tests/test_rcevents.nim, tests/test_kit.nim and tests/test_realizer.nim. The unit adds no behaviour of its own a test could show."

# R-f (DECISIONS I88)
[[item]]
ids = ["RUN-0488"]
reason = "A MAY that never applies in Tier 4 (RUNTIME l.2650). Every provider record belongs to a local module instance: engine.nim gives a provider id only to a local instance whose surface provides a contract, and `moduleRecord` always sets `instance`. Facade providers backed by a remote Runtime come with remote transport (deferred:tier-5). Test [RUN-0401] ... in tests/test_observe.nim reads every listed record's instance."

# R-m (DECISIONS I88)
[[item]]
ids = ["RUN-0491", "RUN-0846"]
reason = "Deployment duties stated in docs/HOST-CONFIG.md. RUN-0491: a Runtime-generated id is accepted by the host under G192's interim: choosing `logos-core-nim.app-config.v1` without `runtime_instance_id`, or a `store_dir` without one, is that acceptance ('Runtime identity'), made before `start` uses the id (tests [IMPL-DECISION G192] in tests/test_host.nim and tests/test_persist.nim). RUN-0846: the deployment's state facility is the host configuration: the request carrier is a `modules` entry's `state_assignment` or a declaration's `persistent_state: true`, both protected host input that is itself the approval (a module's `requested_permissions` request nothing and grant nothing), and the mapping is `state_root/<state_assignment>`, made 0700 before init (test [RUN-0270] ... [LDR-0039] in tests/test_persist.nim)."

# R-n (DECISIONS I88)
[[item]]
ids = ["RUN-0849"]
reason = "A negative over the bindings (RUNTIME l.1605). A Runtime Control binding exists only as `runtime_control` in the initialization input of one realization attempt (runtime/bindings.nim `newAttemptServices`, `fill`); no Host Embedding API function (logos_runtime.h §13.3, runtime/host.nim) and no Runtime Control method returns one for an address, and `connect_remote` acquires nothing while no remote Runtime is enrolled (test [RUN-0043] [RUN-0044] [IFC-0501] in tests/test_routes.nim). A process outside the participant model has no call through which to present an address, so no test can make the attempt."

# R-a (DECISIONS I88)
[[item]]
ids = ["RUN-0003", "RUN-0004", "RUN-0006", "RUN-0017", "RUN-0024", "RUN-0036", "RUN-0040", "RUN-0041"]
reason = "MAYs over local mechanisms and execution modes (RUNTIME l.36, l.49, l.165, l.187, l.208, l.222), taken or not taken; a test cannot show a choice of mechanism. RUN-0003/RUN-0004: the implementation-local mechanisms are the bootstrap mechanism that realizes the Module Loader instance (runtime/engine.nim `bootstrap` with its own runtime/realizer.nim, whose only static registration is the Loader's; RUNTIME l.212, G57), the internal authorizer (runtime/authz.nim decide, used when EngineConfig.authority is unset) and host configuration (runtime/host_config.nim). None has an instance id, a provider record or a route, and identity, lifecycle, routing, authority, observation and audit stay in runtime/engine.nim on the Runtime thread (DECISIONS I75), whose tests cover each of them. RUN-0006/RUN-0017/RUN-0024: only direct mode exists; the bound Module Loader advertises the two direct strategies and refuses a hosted one (test [RUN-0261] in tests/test_engine.nim, test [LDR-0067] in tests/test_loader.nim), so the Module Loader (logos_module_loader, direct_static, I89), the Capability Authority (logos_capability_authority, direct_static, G48(a)) and the host-supplied orchestration module are direct-mode local instances and local transport mode is not taken. RUN-0036: the two system service providers realize work (the Module Loader) and evaluate policy (the Capability Authority); the engine checks and applies the Loader's records and the Authority's decisions (tests [RUN-0309] [RUN-0310] [BCP-0022] in tests/test_loader_engine.nim and [RUN-0329] in tests/test_runtime_authority.nim). RUN-0040/RUN-0041: the Runtime Control binding is in-process (runtime/bindings.nim rcCallOp) and builds no Transport message, and it still validates every request (test [RUN-0042] in tests/test_routes.nim)."

# R-svc (DECISIONS I88)
[[item]]
ids = ["RUN-0019", "RUN-0047", "RUN-0048", "RUN-0049"]
reason = "System service providers in this revision (RUNTIME l.165, l.245, l.250). RUN-0047 (a MAY, taken): the Package Manager is the one omitted (resolved records come from host configuration, G55), and the Capability Authority is omitted when EngineConfig.authority is unset; the Module Loader is always bound (I89; test [RUN-0309] [RUN-0310] [BCP-0022] in tests/test_loader_engine.nim). RUN-0049 (a MAY, taken): policy is then evaluated internally by runtime/authz.nim, which RUNTIME l.1633-1634 permits for local trusted deployments. RUN-0048: the omission weakens nothing: every engine check point asks the same authorization path whichever source decides; the CA parity suites (tests/test_routes_ca.nim, tests/test_events_ca.nim, tests/test_observe_ca.nim, tests/test_rcevents_ca.nim) rerun the base suites with the authority bound, and a configured authority that is not bound fails closed (tests [RUN-0050], [RUN-0051] and [RUN-0307] in tests/test_runtime_authority.nim). RUN-0019: no remote facade or external host service exists in this revision; runtime/engine.nim checkBinding binds only the configured local instance and the Module Loader binding only the Runtime's own `logos_module_loader` instance (runtime/plumbing.nim `namesLoader` reserves its id, module name and binding; test [LDR-0006] in tests/test_loader_engine.nim), and test [RUN-0307] shows an instance without the pinned primary contract is never bound (the plan's hint, the CAP-0006 case of '[RUN-0313] … the configured authority is bound once ready', shows only the positive binding)."

# R-b (DECISIONS I88)
[[item]]
ids = ["RUN-0026", "RUN-0027", "RUN-0028", "RUN-0029", "RUN-0030", "RUN-0031", "RUN-0032", "RUN-0033", "RUN-0034", "RUN-0035", "RUN-0037", "RUN-0110"]
reason = "Where Runtime-owned state lives (RUNTIME l.196-208, l.591): a property of the code's structure, which no single test can show. One Runtime thread owns every record (runtime/engine.nim header; DECISIONS I75): retained intent and lifecycle acceptance, instance identity and state, realization acceptance (checkContracts and the readiness checks), provider registration and selected-contract selection (runtime/routes.nim selectContract), route establishment, renewal and revocation, enforcement at call, event, subscription and route boundaries (engine.nim admit, runtime/invoke.nim checkRequest), and Runtime Control. Module code and the Module Loader's calls run on workers and only return values (runtime/native.nim probeNative and its NativeProbe; runtime/plumbing.nim mkInitialized messages; the Loader's encoded responses, which runtime/loaderbinding.nim `readReply` decodes), which the Runtime thread checks before applying anything. RUN-0037: the Capability Authority returns a decision, which runtime/authscopes.nim readDecision validates (test [RUN-0329] in tests/test_runtime_authority.nim); authority/ imports no Runtime state (inspection item CAP-0195). RUN-0110: the Module Loader is the responsible boundary for every instance but its own, and the bootstrap mechanism for the Loader's (G57); the engine obtains their realization, release and status outcomes and applies the transitions (tests [RUN-0667], [RUN-0357], [RUN-0791] in tests/test_engine.nim; [BCP-0023] [BCP-0024] and the lost-answer suite [IMPL-DECISION G252] in tests/test_loader_engine.nim). RUN-0033 and RUN-0035: no Transport handoff, remote export or profile requiring resource-accounting hooks exists in this revision, so the only handoff validated is the realization's (test [RUN-0104] in tests/test_engine.nim)."

# R-e (DECISIONS I88)
[[item]]
ids = ["RUN-0059", "RUN-0077", "RUN-0080", "RUN-0081", "RUN-0083", "RUN-0149", "RUN-0151", "RUN-0156", "RUN-0157"]
reason = "ABI caller MAYs and negatives (RUNTIME l.293, l.392, l.404, l.413, l.821, l.846, l.871). RUN-0059: no setter is called or required; the symbols bound are exactly runtime/native.nim ModuleSymbolSuffixes (name, init, apply_configuration, destroy, call_surface, free, dispatch, async_api; test [RUN-1084] in tests/test_realizer.nim), and services reach a module only in its initialization input (test [RUN-0073]). RUN-0077: static linking is taken (test [RUN-0079] in tests/test_realizer.nim). RUN-0080: static and dynamic bindings go through one native.nim bindNative with one symbol set, so there is no second callee-side interface. RUN-0081: the MAY is not taken; the Runtime always calls the module's dispatch (runtime/invoke.nim callProvider). RUN-0083: a host duty, stated in docs/HOST-CONFIG.md 'What the host can expect', Static bindings: registration closes at the first start and a static record naming no registered binding fails start before anything runs; registration after start is NOT_READY (test [RUN-0758] in tests/test_host.nim). RUN-0149: the generic helper is the route handle's vtable `call` (logos_types.h; runtime/bindings.nim routeCallOp). RUN-0151: the boundary validates and then commits with normalize and valueRoot (transport/boundary.nim), the valueRoot the pinned App B vectors check (tests/test_values.nim); the recorded commitments equal those recomputed from the typed values (test [RUN-0334] in tests/test_audit.nim). RUN-0156/RUN-0157: no per-route cache is kept (every call is admitted by runtime/engine.nim admit), and runtime/callside.nim HandleState holds no function pointer, so a consumer never receives a provider address."

# R-c (DECISIONS I88)
[[item]]
ids = ["RUN-0066", "RUN-0100", "RUN-0109", "RUN-0148", "RUN-0150"]
reason = "Illustrative blocks (RUNTIME l.347, l.483, l.553, l.808, l.824); each is matched by code and tested piece by piece. RUN-0066 (the dlopen sketch): runtime/artifact.nim maps the verified private copy with RTLD_NOW|RTLD_LOCAL and runtime/native.nim bindNative resolves the known-name symbols (tests [RUN-0133] and [RUN-0068] in tests/test_realizer.nim). RUN-0100 (the module record sketch): the engine's Inst carries the state, provider id and instance, and its module_record view (runtime/engine.nim) adds the mode, always direct, as list_modules reports them (test [RUN-0401] in tests/test_observe.nim). RUN-0109 (the state diagram): each transition is tested (tests [RUN-0667], [RUN-0357], [RUN-0708], [RUN-0796] in tests/test_engine.nim, [RUN-0643] in tests/test_recovery.nim). RUN-0148 (the typed helper sketch): lcn-gen emits lcn_invoke_<namespace>_<Method>(route, response_owner, ins, outs) (tests/generated/meter_module_calls.h; test [IFC-0699] in tests/test_calls.nim). RUN-0150 (the generic call sketch): the route handle's vtable `call` in logos_types.h, served by runtime/bindings.nim routeCallOp (test [RUN-0152] in tests/test_routes.nim)."

# R-i (DECISIONS I88)
[[item]]
ids = ["RUN-0075"]
reason = "Binding retention (RUNTIME l.382) holds by construction: bindings are never unloaded. runtime/artifact.nim keeps every mapped library for the Runtime's life, static registrations stay until logos_runtime_destroy, and runtime/realizer.nim finishRelease destroys a context but releases no binding (docs/HOST-CONFIG.md 'Loaded code'; DECISIONS I88 deviation 1; TF-03). A test cannot show the absence of an unload; the neighbouring tests are [RUN-0072] (one binding serves every instance) and [RUN-0133] in tests/test_realizer.nim."

# R-k (DECISIONS I88)
[[item]]
ids = ["RUN-0088", "RUN-0089", "RUN-0090"]
reason = "Module-selected call bindings (RUNTIME l.436) are conditional on exposing one, and this implementation exposes none: a route handle is made only for one exact selected contract (materialize_route with the route's expected contract; runtime/routes.nim selectContract). The neighbouring describe_provider follows the same rule and fails rather than return a filtered surface when a discover is refused (tests [RUN-0091] and [RUN-0094] in tests/test_observe.nim)."

# R-ns (DECISIONS I88)
[[item]]
ids = ["RUN-0102", "RUN-0103"]
reason = "Negatives over names (RUNTIME l.516, l.522). The runtime module name and the schema namespace are separate values (the record's module name; the namespace inside the validated contract set), and no code compares one with the other: runtime/engine.nim establish selects providers by expects(root) and the contract by runtime/routes.nim selectContract, never by name. Neighbouring tests: [RUN-0557] in tests/test_routes.nim (a route selected by contract root) and [RUN-0104] in tests/test_engine.nim (the call surface compared by commitment). The plan's tag hint does not fit: no test can show that a comparison is absent."

# R-p (DECISIONS I88)
[[item]]
ids = ["RUN-0107", "RUN-0132"]
reason = "MAYs taken (RUNTIME l.538, l.720). RUN-0107: the validated contract views stay in the realized binding's contracts (runtime/native.nim, a ModuleBinding) and are used for selectContract, logos.schema introspection (runtime/invoke.nim introspect) and describe_provider, after a stop too (test [RUN-0094] in tests/test_observe.nim). RUN-0132: realization starts only after record validation, the execute decision and digest verification (tests [RUN-0130] in tests/test_engine.nim and [RUN-0131] in tests/test_realizer.nim)."

# R-d (DECISIONS I88)
[[item]]
ids = ["RUN-0123", "RUN-0124", "RUN-0125", "RUN-0139"]
reason = "Negatives about package and artifact inputs (RUNTIME l.684, l.690, l.736). No Package Manager is bound (G55): resolved records come from host configuration as direct records (runtime/records.nim), which reuses only the package manifest's RequestedPermission type and defines no second manifest or package fact (RUN-0123). RUN-0124/RUN-0125: the MAY to enumerate is not taken; nothing lists artifact paths (the one directory listing, durable.nim fileNames, reads the state store's own files), and an artifact is mapped only after its digest is verified (test [RUN-0131] in tests/test_realizer.nim). RUN-0139: records carry no dependency edge; start ordering comes only from the host's explicit ordering input (test [RUN-0140] in tests/test_engine.nim), and admission, startup and route authority come from authorization (tests [RUN-0130] in tests/test_engine.nim and [RUN-0850] in tests/test_routes.nim)."

# R-f (DECISIONS I88)
[[item]]
ids = ["RUN-0160", "RUN-0161", "RUN-0163", "RUN-0164", "RUN-0166", "RUN-0167"]
reason = "Routing-selection MAYs (RUNTIME l.907, l.932) in an implementation with only local direct providers. RUN-0160/RUN-0161: selection policy is internal to the engine (runtime/engine.nim establish: instances whose binding expects the root, an optional provider address, and the providers a discover allow shows; test [CAP-0041] in tests/test_routes.nim); no external routing policy input exists. RUN-0163: routes are acquired lazily, only by a consumer's establish_route. RUN-0164/RUN-0166: selection is recomputed for each request from current state and nothing is kept between acquisitions (tests [RUN-0556] and [RUN-0558] in tests/test_routes.nim). RUN-0167: there is no automatic re-acquisition or reselection; a failed route stays failed, restarting its provider does not revive it, and a new route needs a new establish_route with a new id (test [RUN-0579] in tests/test_routes.nim)."

# R-commit (DECISIONS I88)
[[item]]
ids = ["RUN-0187"]
reason = "A negative over route readiness (RUNTIME l.990). There is one commitment-model, hash-profile and hash-suite triple (pins.nim CommitmentModelId, HashProfileId, HashSuiteId), and both boundaries of a direct route use it (transport/boundary.nim). A contract under another triple never reaches a route: iface/surface.nim parseSchemaCommitment refuses other identifiers at binding (test [IFC-0245] in tests/test_call_surface.nim), and the Runtime Control schema fixes the three identifiers as literals in logos.schema_commitment (pins.nim). The direct boundary commits every request and response (test [RUN-0332] in tests/test_audit.nim)."

# R-mode (DECISIONS I88)
[[item]]
ids = ["RUN-0190"]
reason = "A rule across execution modes (RUNTIME l.1012). Only direct mode exists, so the route-handle surface has one implementation (runtime/bindings.nim routeCallOp, routeSubscribeOp, routeUnsubscribeOp, routeObserveEndOp) and there is no second mode to compare. Its behaviour is tested in tests/test_events.nim (tests [RUN-0191] and [RUN-0193]) and tests/test_routes.nim. The plan's hint (tests/test_calls.nim) does not fit: that file tests typed call helpers through tests/support/testroute, with no subscriptions and no second mode."
