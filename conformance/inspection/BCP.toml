# bcp-deploy-doc (DECISIONS I97, G309, G310)
[[item]]
ids = ["BCP-0038", "BCP-0039"]
reason = "docs/DEPLOYMENT.md is logosd's §5.4 document (G310: logosd claims no complete system, owner decision 10 (a), and publishes the document as a deployment that owes it would). Its item table has one row per §5.4 item (rows 0 to 23, split where a part is supported and another is not) and indexes every applicable choice. Its second table is the sweep BCP l.355 needs: a search of the pinned specifications (6a4dfa28) for 'MUST document', 'MUST be documented', 'documentation MUST', 'MUST identify', 'MUST state', 'MUST describe' and 'documented', read hit by hit, whose hits that assign a choice to a deployment are rows: R l.187, R l.1395, R l.3037, R l.3394, R l.3775, R l.4035, IF l.881, IF l.3150, CA l.101-103, CA l.406-407, CA l.408, CA l.760, CA l.1320, T l.815-816, T l.1343-1345, CFG l.134, CFG l.261, PM l.402. The Package Manager's own duties (PM l.836, l.859, l.934, l.1191, l.1705) belong to a Package Manager, which is not deployed (Tier 5); the document says so. The other hits are duties of a specification, a record or a message. The items answered None or Not supported are listed under their own units below."

