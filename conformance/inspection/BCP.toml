# LOGOS-MODULE-SYSTEM-BCP requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.

# bcp-diagram (DECISIONS I88)
[[item]]
ids = ["BCP-0004"]
reason = "An illustrative block: the layer diagram of the specification set and its dependency direction (BCP §1). It states no behaviour a test could check. What this repository claims of each named spec is in conformance/claims/ and docs/CONFORMANCE.md: the layer 1 and 2 specs in direct and local-transport mode, the Capability Authority from layer 3, LOADER for the direct strategies and hosted_dynamic in a process (I89, I91), the Package Manager's artifacts and resolver with its handoff and installation in Tier 5, and the Credential Store undefined by any spec (G159). Re-read for DECISIONS I97 at the end of Tier 4b."

# bcp-logging (DECISIONS I88)
[[item]]
ids = ["BCP-0098"]
reason = "Optional logging here is logosd's log (stderr; docs/DAEMON.md §12, daemon/logging.nim) and the Runtime's diagnostics that logosd drains into it (daemon/diagdrain.nim, Tier 4b step 4b-6d). Neither is required audit or an enforcement input. The Runtime's diagnostics are a bounded in-memory list (engine.diagnose, plumbing.MaxDiagnostics, the oldest dropped first) that no audit or enforcement step reads or waits on; logosd reads it on a thread of its own, and a log write that fails is dropped (logging.stderrSink). Required audit is separate from both: call records are produced at the invocation boundary (runtime/callaudit.nim; tests [CAP-0205] [CAP-0210]) and the authority keeps its own audit in its state (authority/audit.nim; test [CAP-0244] [CAP-0264]); enforcement never depends on a diagnostic or a log line being kept. Re-read for DECISIONS I97: the Tier 4 reason said no deployment log sink was built, which 4b-6d made false."

# bcp-non-production-doc (DECISIONS I95, K23, D27)
[[item]]
ids = ["BCP-0094"]
reason = "The deployment documentation part: docs/DAEMON.md §6 states that the development switch makes the deployment non-production, what it enables (allow-all, test_hooks) and where the designation shows (the start log's NON-PRODUCTION warning and ready line, the deployment field of every logosctl JSON envelope, the banner of its text output). The diagnostics part is tested: test_logosd [BCP-0094] (start log, online and offline commands, text and JSON) and test_ctl_module [BCP-0094] (each response's deployment follows the handoff)."

# bcp-switch-gates (DECISIONS I95, D27, G300)
[[item]]
ids = ["BCP-0096"]
reason = "What the switch gates, found by a grep for `development` over src/: daemon/config.nim check 3 (allow-all and test_hooks are accepted only with it on) and the designation (daemon/assemble.nim's warning, ready line and presentation handoff; logosctl.nim's output). Nothing under runtime/, authority/, orchestration/ or transport/ reads it, so the Capability Authority's policy evaluation, trust continuity (trustfile.nim, which writes it but checks revisions the same either way), the host-configuration checks and every Core check run unchanged. test_logosd [BCP-0096] shows one: with the switch on under capability-authority, `module stop logos_module_loader` is still NOT_AUTHORISED; test_daemon_config's continuity rows run with the switch on as well."

# bcp-fixed-profiles (DECISIONS I97)
[[item]]
ids = ["BCP-0027"]
reason = "The six specification-fixed profiles of BCP §5.3 that this implementation uses are each implemented as their owning specification fixes them, as one constant compared on receipt and never chosen from configuration: module-boundary encoding, Logos deterministic CBOR (cbor/; tests/test_cbor.nim and the CDE vectors); physical commitments, logos.hash-profile.2026-08.choice-index with logos.hash-suite.blake3-256 (pins.nim HashProfileId, hash/; tests/test_hash.nim, tests/test_commitment.nim, tests/test_blake3.nim); package signatures, logos.package-signing.cose-sign1-slh-dsa-sha2-192s (package/signing.nim over the vendored slhdsa-c, R4; tests/test_package.nim, tests/test_slhdsa.nim); call evidence, logos.call-evidence.cose-sign1-slh-dsa-sha2-192s (runtime/evidence.nim; tests/test_evidence.nim); route tickets, logos.route-ticket.random-256 (transport/ticket.nim RouteTicketProfile; tests/test_transport.nim, tests/test_transported.nim); protected local transport, logos.local.unix-stream (transport/io/, runtime/routing.nim: local-transport is unix-stream only, test [RUN-0741] in tests/test_host.nim). No code path offers another mechanism for any of them, and an identifier naming another profile fails the operation (the tests tagged [BCP-0063]). The optional and Tier 5 rows (package provenance, tls-tcp, QUIC, the lgx and nix realization profiles) are not implemented, so nothing replaces them."

# bcp-no-override (DECISIONS I97, G312)
[[item]]
ids = ["BCP-0028"]
reason = "The explicit selections this deployment takes are honoured even where another is supported: a routing rule (app-config.v1 and daemon-config.v1 `routing`, runtime/routing.nim, G254) that selects local-transport for a pair in one process gets a local-transport route under logos.local.unix-stream although direct would serve it (test [BCP-0028] in tests/test_transported.nim), and a hosted placement whose transport endpoint fails is not served directly instead (P-4 in tests/test_hosted_routes.nim, test [BCP-0028] in tests/test_logosd.nim). establish_route has no request field that selects a profile, so no request selection exists to override; every other Core profile is fixed (bcp-fixed-profiles). Loader strategies and hosted placements are not Core profiles (G312, the K49 reading): LOADER's own rule governs them (an unadvertised one is unsupported-strategy, L l.377), and the placement tests support this unit only by analogy."

# bcp-profile-names (DECISIONS I97)
[[item]]
ids = ["BCP-0061", "BCP-0062"]
reason = "No Core profile is defined by a string, key, backend name or label: each profile used is named by its owning specification's identifier (bcp-fixed-profiles), and the configuration formats select none by a name of their own. Routing rules name a mode (direct or local-transport), whose profile is the fixed logos.local.unix-stream. `permissions.profile` names the permission profile that CA §3.3-§3.5 asks a deployment to define (logos-core-nim.permission-profile.v1, G279); its names appear only where CA puts permission names (scopes, settings and definitions). The other logos-core-nim.* identifiers name this implementation's own documents (app-config, daemon-config, the carrier, the store, the trust file) and appear in no Transport Hello, invocation descriptor, Runtime Control address or discovery result. Test hooks are code under the lcnTestHooks define (docs/CONFORMANCE.md 'Test hooks'; D27 as amended), absent from every packaged build (flake check no-test-hooks), selected by in-process calls only (G300), and named in no address, discovery or negotiation field."

