# bcp-deploy-doc (DECISIONS I97, G309, G310)
[[item]]
ids = ["BCP-0038", "BCP-0039"]
reason = "docs/DEPLOYMENT.md is logosd's §5.4 document (G310: logosd claims no complete system, owner decision 10 (a), and publishes the document as a deployment that owes it would). Its item table has one row per §5.4 item (rows 0 to 25, split where a part is supported and another is not) and indexes every applicable choice. Its second table is the sweep BCP l.360 needs: a search of the pinned specifications (6cac8335) for 'MUST document', 'MUST be documented', 'documentation MUST', 'MUST identify', 'MUST state', 'MUST describe' and 'documented', read hit by hit, whose hits that assign a choice to a deployment are rows: R l.178, R l.1317, R l.2946, R l.3252, R l.3632, R l.3900, IF l.853, IF l.1473, IF l.3104, CA l.104-106, CA l.404-405, CA l.406, CA l.752, CA l.1207-1208, CA l.1364, T l.803-804, T l.1329-1331, CFG l.134, CFG l.266, PM l.408, PM l.1252. At 6cac8335 the search was run again over the lines that revision changed; it added IF l.1473, PM l.1727, the Credential Store's duties and BCP l.374 and l.383 (rows 24 and 25). The Package Manager's own duties (PM l.834, l.857, l.931, l.1183, l.1727, l.1731) belong to a Package Manager, which is not deployed (Tier 5), and the Credential Store's (CS l.319, l.370, l.476) to a Credential Store, which is not deployed either (row 24); the document says so. The other hits are duties of a specification, a record or a message. The items answered None or Not supported are listed under their own units below."

