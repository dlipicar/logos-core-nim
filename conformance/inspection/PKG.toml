# Package Manager requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.

[[item]]
ids = ["PKG-0496"]
reason = "A permission. openLgx (src/logos_core/package/lgx.nim) checks in the order its doc comment lists and returns the first failure it detects, with that check's assigned error; the tests in tests/test_lgx.nim each break one rule and expect that rule's error."

# deploy-trust-dependence (DECISIONS I97, G137 as amended 2026-11-16)
[[item]]
ids = ["PKG-0422"]
reason = "A documentation requirement (PM l.402), answered in docs/DEPLOYMENT.md §1 (and its duty table, row PM l.402): continued execution does not depend on current package-signing trust acceptance. Grounds: (1) the trust file (<session>/trust.cbor, docs/DAEMON.md §6; G299) holds only its revision and the development switch, no package-signing anchor; (2) no instance has a signer or package fact: engine.putFacts (src/logos_core/runtime/engine.nim) is the only writer of the attribute source the Capability Authority reads and records InstanceFacts with the module name and no selection for every instance, direct or hosted (docs/HOST-CONFIG.md, Under capability-authority, the attribute source; test [PKG-0422] in tests/test_deployment.nim checks that a hosted instance's execution summary carries a selection naming its implementation and no signer or package; RUNTIME l.3523 takes the summary's signer from the same accepted selection), so a policy rule naming a signer or package matches nothing; (3) a trust-file change takes effect only at the next start (DAEMON.md §6), so nothing running is affected by one. Tier 5 (the Package Manager, its anchors and package-backed selection) is expected to change the answer. Owner, 2026-11-16: 'Start 4b-8, claim 0422'. PKG-0418 to PKG-0421, PKG-0423 and PKG-0424 stay with the Package Manager (Tier 5); CFG-0129's item is the precedent for a documentation duty claimed by inspection."
