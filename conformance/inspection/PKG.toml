# Package Manager requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.

[[item]]
ids = ["PKG-0496"]
reason = "A permission. openLgx (src/logos_core/package/lgx.nim) checks in the order its doc comment lists and returns the first failure it detects, with that check's assigned error; the tests in tests/test_lgx.nim each break one rule and expect that rule's error."

# deploy-trust-dependence (DECISIONS I97, G137 as amended 2026-11-16)
[[item]]
ids = ["PKG-0422"]
reason = "A documentation requirement (PM l.408), answered in docs/DEPLOYMENT.md §1 (and its duty table, row PM l.408): continued execution does not depend on current package-signing trust acceptance. Grounds: (1) nothing uses package-signing trust: the package trust file (<session>/trust.cbor, docs/DAEMON.md §6; G396, step 5-3a) holds anchors and logosd accepts them at each start, but no Package Manager is deployed, so no package is verified, installed or selected, and the accepted input logosd keeps for step 5-3b (Daemon.signing in src/logos_core/daemon/assemble.nim) is read by nothing; (2) no instance has a signer or package fact: engine.putFacts (src/logos_core/runtime/engine.nim) is the only writer of the attribute source the Capability Authority reads and records InstanceFacts with the module name and no selection for every instance, direct or hosted (docs/HOST-CONFIG.md, Under capability-authority, the attribute source; test [PKG-0422] in tests/test_deployment.nim checks that a hosted instance's execution summary carries a selection naming its implementation and no signer or package; RUNTIME l.3388 takes the summary's signer from the same accepted selection), so a policy rule naming a signer or package matches nothing; (3) a trust-file change takes effect only at the next start (DAEMON.md §6), so nothing running is affected by one. Tier 5 (the Package Manager, its anchors and package-backed selection) is expected to change the answer. Owner, 2026-11-16: 'Start 4b-8, claim 0422'. Re-read at step 5-3a-2b (I114), which made the old ground 1, no anchor in the file, untrue. PKG-0418 to PKG-0421 are claimed with logosd's continuity over that file (5-3a-2); PKG-0423 and PKG-0424 stay with step 5-8; CFG-0129's item is the precedent for a documentation duty claimed by inspection."

# resolver-limit-maxima (re-pin P7b, DECISIONS G361)
[[item]]
ids = ["PKG-0597"]
reason = "A documentation requirement (PM l.1252). docs/CONFORMANCE.md 'Resolver limits' gives the maximum supported for each resolver limit: partial_closure_names 4,096, dependency_depth 4,095, candidates_per_name 4,096, assignment_attempts 1,048,576. They are MaxResolverLimits in src/logos_core/package/resolver.nim (G361), and docs/DEPLOYMENT.md's duty table (row PM l.1252) and §12 point at the section. The [PKG-0598] test in tests/test_resolver.nim checks the document against the constants and that both constructors refuse a larger value; a second [PKG-0598] test resolves a chain of 4,096 names at the maxima."

# catalog-platform-metadata (re-pin P7b, batch C C7)
[[item]]
ids = ["PKG-0604", "PKG-0605"]
reason = "A permission not taken (PM l.1311-1312). The catalog carries no platform metadata in this implementation: a catalog entry is an identity and a source (src/logos_core/package/records.nim), so no candidate is excluded before its material is obtained. Every reached record goes to the Inspector, which judges the platform from the verified manifest (lgxInspector and openLgx; the [PKG-0584] test in tests/test_resolver.nim). PKG-0605's condition, such metadata, never arises."

# pm-baseline-only (step 5-3b-1, DECISIONS G404, I116)
[[item]]
ids = ["PKG-0085", "PKG-0449"]
reason = "A permission not taken (PM l.457, PKG-0085) and a deployment duty met by the baseline (PM l.594, PKG-0449). No package-signing or catalog profile beyond the baseline exists: the package trust file's catalog section has only `selected`, and a file that selects anything is refused by checkTrust (src/logos_core/package/trustdoc.nim; G398) at logosd's start and again by the Package Manager's input check (decodePmInput, src/logos_core/pm/input.nim; tests [PKG-0086] in tests/test_pm_input.nim). The catalog document is closed (src/logos_core/pm/catalog.cddl) and has no profile, key, log or checkpoint field. docs/PACKAGE-MANAGER.md §6 documents that the implementation provides no authenticated catalog ordering, freshness or external anchoring, so a deployment that requires them cannot be built from it."

# pm-no-freshness-requirement (step 5-3b-1, DECISIONS G404, I116)
[[item]]
ids = ["PKG-0089"]
reason = "A conditional duty whose condition never arises (PM l.467). The trust input cannot require revocation, a minimum accepted version or fresh external-anchor evidence: the package trust file (lcn.package_trust, src/logos_core/package/trustdoc.cddl) is closed and has no such field, and a catalog or provenance selection is refused (G398, G404; tests [PKG-0086] and [PKG-0090] in tests/test_pm_input.nim). The only active requirement is the package's own signature under the accepted anchors, checked on every use, cached or not (G403; tests [PKG-0077] in tests/test_pm_vcache.nim). docs/PACKAGE-MANAGER.md §6 states it."

# pm-install-root-not-shared (step 5-5-2, DECISIONS G444, I121; the owner's Q5 (a))
[[item]]
ids = ["PKG-0488"]
reason = "A conditional duty whose condition never arises (PM l.931): no installed record depends on shared artifact storage. Each record's artifacts are its own files, in its own random directory below the instance's installation root, <state_dir>/install/r/<rid>/a/ (src/logos_core/pm/store.nim; DECISIONS G444), and no setting of daemon-config or the protected input names another root or a shared store. A second store on the same root is refused by the root's lock, so the instance does not start (test [PKG-0487] in tests/test_pm_store.nim). docs/DEPLOYMENT.md §1 documents the scope. The scope is choice (a) of the owner's Q5 (plan tier5-plans/step5-5-plan.md §14 and §15), answered on 2026-11-22."

# pm-resource-access (step 5-5-2, DECISIONS G444, C8 / G93, I121)
[[item]]
ids = ["PKG-0498"]
reason = "A documentation requirement (PM l.1183), answered in docs/DEPLOYMENT.md §1, 'Resource access': a module reaches its packaged resources and data only through its schema-typed configuration; local_path is the Loader's installation location and no module is told of it. The Runtime handoff the Package Manager builds (src/logos_core/pm/handoff.nim, buildHandoff; DECISIONS G451) carries the implementation artifact's local_path and hash and the configuration declaration's schema and default values, and no package root, artifact id or path table (PM l.1185; tests [PKG-0340] and [PKG-0342] in tests/test_pm_records.nim). A library shipped beside a module is installed and bound to its verified bytes (test [PKG-0293] in tests/test_pm_store.nim) and is not loaded by the Loader (C8, G93)."

# pm-platform-profile (step 5-5-4, DECISIONS G453, G73, I121)
[[item]]
ids = ["PKG-0493"]
reason = "A documentation requirement (PM l.950), answered in docs/DEPLOYMENT.md §1, 'The target platform': the values defined (os linux, darwin, windows, android, ios; architecture x86_64, aarch64; abi gnu, musl, mingw, msvc), the targets the hosted Package Manager runs on (linux and darwin, x86_64 and aarch64, abi gnu or musl on Linux and none on Darwin) and the matching rules (each field a variant names matches a defined value byte for byte, a value with no defined rule never matches, a field it leaves out constrains nothing, and the first compatible variant in declared order is selected; G73). The target is the host the Package Manager runs on, lgx.hostPlatform, fixed for the instance and given to the worker at its start (src/logos_core/package/lgx.nim, src/logos_core/pm/jobs.nim); a package with no variant for it is incompatible-platform (test [PKG-0495] in tests/test_lgx.nim)."

# pm-one-realization-profile (step 5-5-4, DECISIONS G449, I121)
[[item]]
ids = ["PKG-0222"]
reason = "Only the LGX realization profile is built (tests [PKG-0189] and [PKG-0190] in tests/test_pm_install.nim: an LGX package installs, a nix source is unsupported-source), so every manifest, validation, installed-record and handoff requirement the claims cover is met through it (PM §5, §7.1, §10, §12). The installed record, its checks on load and the handoff are built once, from a verified package, whatever its source (src/logos_core/pm/installed.nim, handoff.nim; DECISIONS G445, G451); work item 5-10, if built, adds the nix profile under the same code and its own tests under [PKG-0222]."

# pm-backend-mechanics (step 5-5-4, DECISIONS G403, G444, G449, I121)
[[item]]
ids = ["PKG-0363"]
reason = "A MAY the Package Manager takes, internally: the verification cache (src/logos_core/pm/vcache.nim; G403, G447; test [PKG-0394] in tests/test_pm_install.nim), the installation root and its record directories (src/logos_core/pm/store.nim; G444) and deferred retirement, a removed or replaced record's directory deleted once no operation's snapshot names it (G449; test [PKG-0401] in tests/test_pm_install.nim). None of them is visible in a result."

# pm-no-retained-kid (step 5-5-4, DECISIONS G166, G445, I121)
[[item]]
ids = ["PKG-0441"]
reason = "No kid is retained, so none can stand in for the key identity: the installed record's and the inspection record's signer is App A's package_signer, the profile and the 48-byte public key only (spec/mirrors/PKG/app-a.contract.cddl; src/logos_core/package/signing.nim signerRecord), and every check of a retained signer compares that key under the accepted anchors (src/logos_core/package/resolver.nim, src/logos_core/pm/handoff.nim; tests [PKG-0080] and [PKG-0440] in tests/test_pm_install.nim)."

# pm-never-co-located (step 5-6a-1, DECISIONS G490, G491, C1, I140)
[[item]]
ids = ["PKG-0005", "PKG-0006"]
reason = "A permission not taken (PM l.31, PKG-0005) and a duty whose condition never arises (PKG-0006). The Package Manager is never co-located or statically linked: by the owner's C1 it is hosted in its own process, the module logos_package_manager realized hosted_dynamic with placement process. The host configuration's mark accepts only such an instance and refuses a direct_static or direct_dynamic entry (runtime/host_config.nim; test [PKG-0003] in tests/test_host.nim), and logosd composes it only that way (compose.nim pmRecord; DECISIONS G491). So no Package Manager code runs in the Runtime's process, and no direct-mode instance of it exists to represent."

# pm-watch-visibility (step 5-6b-2, DECISIONS G498, G501, I144)
[[item]]
ids = ["PKG-0547", "PKG-0548", "PKG-0549"]
reason = "The watch's visibility decision is data, not a callback: the protected input's reader list and the Runtime it names (G498), fixed for the realization and read through `readerOf` in src/logos_core/pm/facade.nim from the invocation's Runtime-authenticated caller, at admission and again before each hint (G501). No synchronous authorization callback exists to retain (PKG-0547). When the caller can no longer be read (the invocation ended) or is no longer a reader, the check fails and the watch ends MODULE_ERROR with no hint published, and the operator's log names the caller (PKG-0548); no test can take the context away while a watch waits, since the readers do not change while the instance runs. The reader list is the protected adapter PKG-0549 permits, and the contract gains no permission operation (PKG-0549)."

# pm-watch-ends-within-limits (step 5-6b-2, DECISIONS G501, G338, I144)
[[item]]
ids = ["PKG-0560"]
reason = "An admitted watch never has to end for its limits (PM l.1772): it holds at most one hint in flight and folds every later change into one more (`observe` in src/logos_core/pm/facade.nim), so nothing it retains grows past its bound; the bounds on watches themselves are applied at admission (4 per caller, 16 in all, tested under [PKG-0558] in tests/test_pm_queries.nim). It ends only through ordinary completion ({} when a hint is not delivered or the Package Manager stops) or invocation failure (CANCELLED when the Runtime cancels it), and a hint already handed to the kit is answered before the call completes (G338: a job completes only after every publication of its invocation was answered), so no committed delivery obligation is discarded."
