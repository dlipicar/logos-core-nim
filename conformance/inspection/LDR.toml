# MODULE LOADER requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.
#
# The Runtime binds a `logos_module_loader` instance (DECISIONS I89, Tier 4b step 4b-1), so LOADER is
# claimed for the direct strategies (conformance/claims/LDR.toml).

[[item]]
ids = ["LDR-0006"]
reason = "A negative over what can be bound (LOADER l.23). The engine binds only the instance it established itself from its reserved registration (runtime/engine.nim `establishLoader`, `checkLoader`, `loaderBindingRefusal`: a local `ready` instance whose primary contract is the pinned Module Loader contract). Host configuration, `create_module` and module declarations cannot name the reserved instance id, module name or static binding (runtime/plumbing.nim `namesLoader`, checked in runtime/host_config.nim and runtime/engine.nim), and no remote facade or external host service exists in this revision (inspection item RUN-0019). Tests [LDR-0006] in tests/test_loader_engine.nim and tests/test_host.nim show the reserved names refused and routes to the Loader refused; the absence of any other binding path is a property of the code."

[[item]]
ids = ["LDR-0010"]
reason = "A negative over the Loader's code (LOADER l.102). src/logos_core/loader/ imports from runtime/ only the realizer and what it uses (config, native, artifact), the side table, the bell and callside's call frames; none of engine, store, routes, bindings, observe or rcevents. The Loader returns realization records and status in its responses, and the engine applies every transition on the Runtime thread (runtime/engine.nim `realizeThroughLoader`, `releasedThroughLoader`, `classify`; DECISIONS I75). The tests show the engine's transitions; that the Loader has no path to Runtime-owned state is shown by its imports."

[[item]]
ids = ["LDR-0022"]
reason = "A duty of the language implementation (LOADER l.202). Nim exports the canonical C ABI only through an adapter: lcn-gen's kit (src/logos_core/codegen/kitgen.nim) generates the `_MODULE_*` exports for the Loader (src/logos_core/loader/logos_module_loader_kit.nim) and for every test fixture built with a kit (tests/support/kitbuild.nim). The kit's own tests show the exported ABI; that this is the adapter the rule asks for is a fact about the build."

[[item]]
ids = ["LDR-0042"]
reason = "A negative over the whole Loader (LOADER l.287). Per-instance state reaches the module only through logos_module_init_input_t.state_dir, which runtime/realizer.nim fills from the realize request's mapped state assignment (tests [LDR-0039] and [LDR-0041] in tests/test_loader.nim, [RUN-0275] in tests/test_persist.nim). No code under src/ mutates the process environment: `grep -rnE 'putEnv|putenv|setenv|unsetenv|delEnv' src/` finds nothing (DECISIONS I82)."

[[item]]
ids = ["LDR-0088"]
reason = "Where constraints come from (LOADER l.425). Requests reach the Loader only through the engine's binding: every route to the Loader is refused (test [LDR-0006] in tests/test_loader_engine.nim), and the handlers serve only a SYSTEM_SERVICE caller, the Runtime's own call (src/logos_core/loader/provider.nim, [IMPL-DECISION G251]; test [LDR-0088] [IMPL-DECISION G251] in tests/test_loader.nim). Private handoffs come only from the engine's side table (test [LDR-0088] [LDR-0148] in tests/test_loader.nim), and the statics, artifact root and state root only from the wiring the bootstrap mechanism records under an engine-owned key (`wireLoader`). That no other boundary supplies a constraint is a property of these paths."

[[item]]
ids = ["LDR-0118"]
reason = "A MAY about forced termination of the execution envelope (LOADER l.570). Nothing in this revision forces termination: `force_release` is never advertised (K7; the refusal is tested as LDR-0120 and LDR-0121 in tests/test_loader.nim), and direct execution has no envelope apart from the host process."

[[item]]
ids = ["LDR-0152"]
reason = "A negative over the contract's encoding (LOADER l.699). The generated contract types (src/logos_core/loader/logos_module_loader_types.nim) hold no pointer or handle field: every field is a CBOR-mapped value (the pointers in that file are only its codec procedures' work arguments). Contexts and bindings cross between the Loader and the engine only in the side table (runtime/sidetable.nim; test [LDR-0152] [IMPL-DECISION G250] in tests/test_loader.nim), never in a request or response."
