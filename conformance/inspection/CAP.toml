# CAPABILITY AUTHORITY requirement units checked by inspection rather than by a test.
# Each item names the units and why no test can carry them; `spectrace gate` counts them as covered.

[[item]]
ids = ["CAP-0195"]
reason = "A negative over the whole authority: it reaches no Runtime state. Under src/logos_core/authority/ the only runtime/ imports are rc_types (generated types and the mirrored Runtime Control text), bell (a wake-up primitive) and native (the static symbol table check, in provider.nim): `grep -rnE 'runtime/' src/logos_core/authority/` shows nothing else. Its inputs are the wiring's facts table and clock, and its outputs the publish callback and its own state directory (DECISIONS I84)."

[[item]]
ids = ["CAP-0161", "CAP-0162", "CAP-0164", "CAP-0165"]
reason = "Rules for a policy_changed affected_executions set, a field this authority never produces: every policy_changed it emits is built without it (authority/core.nim), and observed_change has no such field. Tests [CAP-0179] and [CAP-0379] check its absence; with no set there is no completeness claim to verify, order or filter (DECISIONS I84)."

[[item]]
ids = ["CAP-0337", "CAP-0338", "CAP-0339", "CAP-0340"]
reason = "Contract replacement is a deployment rule: docs/AUTHORITY-POLICY.md (State, Contract replacement) says the state carries the contract root it was written under, a different contract refuses to start with every file unchanged (test [IMPL] 'the start is refused ... another contract' in cap.persist), and the old directory keeps its records. No record is rewritten, so none claims another contract's attribution or coverage (DECISIONS I84)."

[[item]]
ids = ["CAP-0092"]
reason = "The policy bytes from the protected wiring (wireAuthority) and the facts table the Runtime feeds are the authority's only trust inputs: no request type carries a key, signer root or certificate the authority would accept, and authority/policy.nim resolves names against roots recomputed from the mirrors. Test [CAP-0092] shows a request cannot add one (DECISIONS I84)."

[[item]]
ids = ["CAP-0262"]
reason = "Least privilege is the policy's shape: every issue, revoke and inspect right comes from an explicit rule, and the one implied right is that a revoke rule lets its holder inspect the grants it may revoke (docs/AUTHORITY-POLICY.md, Rules; authority/policy.nim). Tests [CAP-0262] and [CAP-0263] show a caller without a rule learns nothing (DECISIONS I84)."

# cap-subset (DECISIONS I88)
[[item]]
ids = ["CAP-0045"]
reason = "A rule on whoever needs a separately visible subset of a concrete contract: a module author or deployment, which declares the subset as an interface document under _implements. Neither the Runtime nor the Capability Authority makes one: route access only narrows which operations a route may perform, logos.schema always returns the selected contract's own documents (invoke.introspect builds it from the selected contract, never from the access), and a provider is routed only under its primary contract or one of its declared interface roots (engine.establish). Test [IFC-0449] in tests/test_iface.nim shows an interface route exposes the interface and only its own supporting schemas."

# cap-direct (DECISIONS I88)
[[item]]
ids = ["CAP-0067", "CAP-0069"]
reason = "Direct same-address-space execution only: the bound Module Loader advertises the two direct strategies (I89). CAP-0067: the module-execution decision is applied by the engine before the Module Loader is asked (tests [CAP-0062] [CAP-0290]; a start the policy denies sends nothing to the Loader: test [LDR-0027] [LDR-0087] in tests/test_loader_engine.nim). The Loader's realize request (runtime/loaderbinding.nim `realizeBytes`) carries the instance, the descriptor (strategy, module, binding or artifact), the state assignment and the configuration handoff, and the private handoff in the side table carries the initialization services: never a decision, grant or scope. The only execution constraint a direct path can enforce is its mode: authscopes.enforceable makes an allow with a placement, a mode other than direct or a permission scope an evaluation failure (test [CAP-0068]); operating-system constraints come with permission profiles (§3.5, deferred:tier-4b). CAP-0069: nothing claims containment. docs/HOST-CONFIG.md, 'Permission settings in direct mode', states that `applied` with `[]` claims no containment because direct modules are trusted in-process code (SECURITY l.204; RUNTIME l.1622, l.2545), and get_execution_permissions answers `unavailable` (engine.nim, rmGetExecutionPermissions)."

# cap-messages (DECISIONS I88)
[[item]]
ids = ["CAP-0154", "CAP-0155"]
reason = "The authority's messages are constants: every error.message and denial.message it returns is the fixed text for its code (authority/core.nim ErrorText, DenialText, errorValue, denialValue), never built from a request, the policy, a grant, the state directory or a path, so a message carries no secret, credential, ticket, policy internal or host path, and nothing beyond the code the caller already receives. Which code a caller gets follows the visibility rules: a grant it may not inspect is grant-not-found or absent, never an error that shows it exists (tests [CAP-0135], [CAP-0203], [CAP-0262]). The Runtime never forwards these messages: authscopes.readDecision keeps the error or denial code only, and a caller sees NOT_AUTHORISED (test [RUN-0326])."

# cap-facts (DECISIONS I88)
[[item]]
ids = ["CAP-0285"]
reason = "Attribute transitions are few in this design. The facts the authority evaluates are each instance's module name and selection and each provider's instance (authority/facts.nim), fixed for the instance's life (G47; docs/AUTHORITY-POLICY.md, Freshness). The only transitions are creation, which no earlier decision relied on, and retirement, after which the engine drops every cached decision naming the instance as consumer or target (engine.dropFacts, dcache.dropInstance) and a request naming it is invalid-request (test [CAP-0270]); a retired instance has no execution or route left (retire_module needs it quiescent). The table lives as long as the Runtime handle (host.nim: newSharedFacts at create, freeSharedFacts at destroy); a lookup it cannot answer is authority-unavailable (test [CAP-0283]), an evaluation failure the Runtime fails closed (test [CAP-0153]). Notification-path loss applies Section 8 in full: a new generation and nothing cached carried over (tests [CAP-0172] [CAP-0173], [CAP-0177])."

# cap-renewal (DECISIONS I88)
[[item]]
ids = ["CAP-0307", "CAP-0308", "CAP-0309", "CAP-0310", "CAP-0312", "CAP-0313", "CAP-0314", "CAP-0315", "CAP-0316", "CAP-0317", "CAP-0318", "CAP-0319", "CAP-0320"]
reason = "Rules that apply when deployment policy requires protected execution renewal (CA §5.1 l.584-603). No Tier 4 deployment can require it: neither the host configuration (runtime/host_config.cddl) nor the authority policy (authority/policy.cddl, docs/AUTHORITY-POLICY.md) has such a setting, so no test can put the Runtime under the condition. What 8b builds anyway (DECISIONS I85): the Runtime sets execution_renewal only when it renews a still-valid execution authorization, for the retained consumer, target and scopes (engine.renewExecution; authscopes sets the field only on aaExecute renewals), and sends renewals to a lane of their own (plumbing.Shared.renewals, one renewWorkerMain thread, engine.dispatchEval); ordinary evaluations are refused at EvalWorkers + EvalQueue and never take that lane, there is at most one renewal per running instance, and module-requested lifecycle operations are ordinary evaluations (tests [CAP-0304] [CAP-0311] [CAP-0321], [CAP-0305]). In the authority, Runtime (SYSTEM_SERVICE) requests go to the engine inbox, drained before the bounded module inbox (authority/core.nim run, submit; CAP-0382), so module traffic cannot consume or delay them. Not built, since nothing requires it: a finite reservation in the authority that tells renewals from other Runtime evaluations (the engine inbox is unbounded), charge accounting kept through caller timeout or binding replacement, a check before dependent executions start that the provider and path give the protection, a bound on execution demand by renewal capacity, and invalidation when the protection is lost."

# cap-evidence-key (DECISIONS I88)
[[item]]
ids = ["CAP-0401"]
reason = "A duty on the deployment's key management: the Runtime cannot know where else the bytes of a key file are used. What the repository does: tools/evidence_keygen.nim makes a fresh call-evidence key (FIPS 205 key generation), separate from lcn-pkg keygen's package-signing keys; docs/HOST-CONFIG.md, call_audit, 'The key', tells the deployer to use it for call evidence only, never as a package-signing key, a TLS key or a key of another algorithm; and the Runtime uses the key only in runtime/evidence.nim, for the logos.call-evidence.cose-sign1-slh-dsa-sha2-192s profile with pure SLH-DSA-SHA2-192s (tests [CAP-0230] [CAP-0402] check the key file, [CAP-0403] the signatures). No transport in Tier 4 uses TLS."
