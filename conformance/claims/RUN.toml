# Claim status of each section of spec-module-runtime.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [RUN-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      Tier 4b is closed (DECISIONS I97); no unit may carry this status
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.
#
# The claim is for a Runtime instance (DECISIONS I88, I97): RUNTIME l.66 defines it as the engine plus
# an orchestration module, and BCP l.286 says a RUNTIME claim covers both. logosd's instance is the
# engine with the reference orchestration module, lcn_orchestrator (I94), in direct and
# local-transport mode, with hosted realizations through the Module Host (I91). A host embedding
# liblogos_runtime that names another orchestration module claims jointly with it (BCP l.286;
# docs/HOST-CONFIG.md "Orchestration duties"; docs/CONFORMANCE.md "Claims"). The Runtime binds a
# `logos_module_loader` instance (I89), so the Loader-conditional rules (l.1554, l.3607,
# l.3682-3689, l.3729) are claimed with it.

default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"
# "Appendix A. Implementation Notes (Informative)", l.3959.
"App A" = "informative"
# Local transport mode, a permission (l.46): the hosted process-local boundary (§4.2.1) and
# provider-side local Transport scheduling (§6.2) are claimed with the Module Host (step 4b-3,
# DECISIONS I91, part 4b-3.4); the Runtime-served endpoint of a direct provider (step 4b-2, I90,
# G257) built part of §6.2 first.
# A MAY convenience mode not provided (l.1023); l.1043 steers multi-instance code to handles.
"§5.2.1" = "out-of-scope:a MAY convenience mode not provided (singleton direct calls, l.1023)"

# Re-pin P4b: the order of checks (l.1824-1833) is claimed by default. For an ordinary transported
# call, RUN-1117 before RUN-1118 is claimed under DECISIONS G171's interim reading: each side applies
# the order to the checks it owns. The consumer's side makes its route access checks before the
# payload, and the provider's side makes the call decision before it. A call that is both malformed
# and denied therefore answers INVALID_PARAMS where direct answers NOT_AUTHORISED (l.1257).

[units]
