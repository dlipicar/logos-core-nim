# Claim status of each section of spec-module-runtime.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [RUN-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      not built yet: logosctl, logosd, the Module Host and what they bring
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.
#
# The claim is for the Runtime engine (DECISIONS I88): RUNTIME l.72 defines a Runtime instance as the
# engine plus an orchestration module, and until Tier 4b the host supplies the orchestration module
# (docs/HOST-CONFIG.md lists its duties). The Runtime binds a `logos_module_loader` instance (I89), so
# the Loader-conditional rules (l.1641, l.3754, l.3820-3825, l.3863) are claimed with it.

default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"
# "Appendix A. Implementation Notes (Informative)", l.4092.
"App A" = "informative"
# Local transport mode, a permission (l.49): the hosted process-local boundary (§4.2.1) and
# provider-side local Transport scheduling (§6.2) come with the Module Host (step 4b-3). The
# Runtime-served endpoint of a direct provider (step 4b-2, DECISIONS I90, G257) claims the §6.2
# units it builds below.
"§4.2.1" = "deferred:tier-4b"
"§6.2" = "deferred:tier-4b"
# A MAY convenience mode not provided (l.1094); l.1122 steers multi-instance code to handles.
"§5.2.1" = "out-of-scope:a MAY convenience mode not provided (singleton direct calls, l.1094)"

[units]
# Hosted and transported paths (local transport mode, l.49): the consumer's transported handle
# (step 4b-2b, 4b-2c) and the Module Host (4b-3).
"RUN-0007" = "deferred:tier-4b"
"RUN-0008" = "deferred:tier-4b"
"RUN-0014" = "deferred:tier-4b"
# Remote only (fable-scope §7): `connect_remote` (l.234-241) and the rule that a local route never
