# Claim status of each section of spec-module-capability-authority.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [CAP-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      not built yet: logosctl, logosd, the Module Host and what they bring
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement

# The local Capability Authority (Tier 4 steps 8a and 8b, DECISIONS I84, I85) and the route ticket
# (10a, I83); claimed with Tier 4 (I88).
default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"
# §3.5, permission profiles and definitions, is claimed with Tier 4b step 4b-4a (DECISIONS I93): the
# shipped profile and its one definition, logos-core-nim.host-ambient (G110, G279), containment
# (CAP-0021), the enforcement component and behaviours (CAP-0083); the facility classes, device
# restrictions and provider-enforced permissions by inspection (G283, G286). The Runtime's half, part
# 4b-4b: the permission scopes of an execution decision and their admission (CAP-0063, CAP-0068), and
# the stop when a permission's grant is revoked (CAP-0192). Part 4b-4c, hosted instances: the decision
# before the Loader realizes a Module Host's process, covering `local-transport` in the `process`
# placement and the permission scopes (CAP-0065, CAP-0066; G272), claimed by default.

[units]
# §11, transport step 10a (DECISIONS I83): the route ticket binds the consumer, provider, contract and
# route access; bad material gives no session and no dispatch; a COSE object is not a Hello token
# (CAP-0253, CAP-0255, CAP-0256, claimed by default). CAP-0254 (decision, freshness, revocation) is
