# Claim status of each section of spec-module-interface.md, for core (`src/logos_core/`).
# The spec's ledger and its main claims file are sdk's (sdk/conformance/). Each unit is claimed by the
# package that implements its rule (restructure-in-place row 35, step R9): this file claims the units
# core implements, and gives every other unit sdk's status, with `claimed` there as
# `out-of-scope:sdk` here. `spectrace owners` checks that the two files agree and that each claimed
# unit's evidence is in its owner's tree; tools/restructure/claim_split.tsv records the split.
# The status vocabulary and the longest-match rule are as in the other file.

