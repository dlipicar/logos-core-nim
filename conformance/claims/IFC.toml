# Claim status of each section of spec-module-interface.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [IFC-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.

default = "deferred:tier-4"


[sections]
"Abstract" = "deferred:tier-4"
"References" = "informative"
"Copyright" = "informative"
# Phase 2: schema acceptance, the C type mapping (forward), encodings, validation,
# the common schema and its limits.
"§1" = "claimed"
"§2" = "claimed"
"§2.4" = "deferred:tier-4"
"§2.5" = "deferred:tier-4"
"§2.6" = "deferred:tier-4"
"§2.7" = "deferred:tier-4"
"§2.8" = "deferred:tier-4"
# The C-to-CDDL reverse mapper (D30, G139) waits for the revision; the §3.9 cases
# are claimed in the forward direction.
"§3" = "deferred:tier-5"
"§3.9.1" = "claimed"
"§3.9.2" = "claimed"
"§3.9.3" = "claimed"
"§3.9.4" = "claimed"
"§4" = "claimed"
"§4.6" = "deferred:tier-3"
"§5.1" = "claimed"
"§5.2" = "deferred:tier-4"
"§5.3" = "claimed"
"App A" = "deferred:tier-4"


[units]
