# Claim status of each section of spec-module-loader.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [LDR-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      Tier 4b is closed (DECISIONS I97); no unit may carry this status
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.
#
# The Runtime binds a `logos_module_loader` instance (DECISIONS I89, Tier 4b step 4b-1): a module
# that advertises the direct strategies (K10, decision 10) and, with a Module Host program,
# `hosted_dynamic {process}` (Tier 4b step 4b-3, I91), established by the Runtime's bootstrap and
# called through its contract. LOADER is claimed for both: the hosted provider endpoint (§5.3) with
# part 4b-3.2's tests and absence that cleanup cannot establish (LDR-0125) as an inspection item.
# The trusted transport adapter handoff (§5.4) is not used: the carrier of a hosted module's
# Runtime Control binding is a further private handoff, not a Transport adapter (K3).
default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"
"§5.4" = "out-of-scope:the §5.4 adapter handoff is not used (K3)"

[units]
# `force_release` is never advertised (K7; the refusal is tested as LDR-0120 and LDR-0121).
"LDR-0163" = "out-of-scope:force_release is never advertised (K7)"
"LDR-0164" = "out-of-scope:force_release is never advertised (K7)"
