# Claim status of each section of spec-module-loader.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [LDR-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      not built yet: logosctl, logosd, the Module Host and what they bring
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.
#
# The Runtime binds a `logos_module_loader` instance (DECISIONS I89, Tier 4b step 4b-1): a module
# that advertises the direct strategies only (K10, decision 10), established by the Runtime's
# bootstrap and called through its contract. LOADER is claimed for the direct strategies; the hosted
# strategy (the Module Host, 4b-3) is deferred, as a direct-only Loader advertises none (l.252-259).
default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"
# The hosted provider endpoint and the trusted transport adapter handoff: hosted realizations only.
"§5.3" = "deferred:tier-4b"
"§5.4" = "deferred:tier-4b"

[units]
# Rules of §5.3 that hold for every realization: a direct one has no endpoint.
"LDR-0047" = "claimed"
"LDR-0052" = "claimed"
"LDR-0053" = "claimed"
# The hosted strategy (4b-3); a direct-only Loader advertises no hosted strategy (K10, decision 10).
"LDR-0034" = "deferred:tier-4b"
"LDR-0040" = "deferred:tier-4b"
"LDR-0081" = "deferred:tier-4b"
"LDR-0082" = "deferred:tier-4b"
"LDR-0083" = "deferred:tier-4b"
"LDR-0101" = "deferred:tier-4b"
"LDR-0145" = "deferred:tier-4b"
"LDR-0146" = "deferred:tier-4b"
"LDR-0147" = "deferred:tier-4b"
# `force_release` is never advertised (K7); 4b-3 labels them `out-of-scope`.
"LDR-0163" = "deferred:tier-4b"
"LDR-0164" = "deferred:tier-4b"
# Absence not established: the hosted strategy, 4b-3 (an init that fails and writes a context
# leaves no record here, K35).
"LDR-0125" = "deferred:tier-4b"
