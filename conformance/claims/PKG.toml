# Claim status of each section of spec-module-package-manager.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [PKG-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      not built yet: logosctl, logosd, the Module Host and what they bring
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement
# A `[units]` entry gives one requirement unit its own status, overriding its section's.

default = "deferred:tier-5"

[sections]
"References" = "informative"
"Copyright" = "informative"
# Phase 3 (tier 3): the manifest, its value commitment, package-signing trust
# input, the COSE_Sign1 profile and LGX archives, as package artifacts and the
# lcn-pkg producer tools. At 6a4dfa28 PM-06 replaced Ed25519 with SLH-DSA-SHA2-192s
# (§4.3), built over the vendored slhdsa-c (DECISIONS R4, I68). Promoted from tier
# 5 as sans-I/O: §6 catalog entries and inspection records, and §11 resolution
# (I69, G167). Fetch, catalog documents, the storage role, installation, Runtime
# handoffs and the methods are tier 5. The Package Manager handoff to the Runtime and
# the protected trust-input path come with logosd (Tier 4b; DECISIONS I88).
"§2" = "claimed"
"§3" = "claimed"
"§4" = "claimed"
"§4.1" = "claimed"
"§4.2" = "deferred:tier-5"
"§4.3" = "claimed"
