# Claim status of each section of spec-module-system-bcp.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [BCP-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      not built yet: logosctl, logosd, the Module Host and what they bring
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement

# A complete Logos module system (the composition this BCP defines, its §5 profiles and deployment
# documentation) is logosd's: Tier 4b (DECISIONS I88). What a Tier 4 component already meets is
# claimed by unit.
default = "deferred:tier-4b"
# BCP-0021 to BCP-0024 (the Module Loader in the composition) are tagged by Tier 4b step 4b-1's tests
# (I89) and keep this default until the BCP's status changes with logosd (4b-8).

[sections]
"References" = "informative"
"Copyright" = "informative"

[units]
# The layer diagram, the consumer binding (Tier 4 step 8b) and audit that optional logging never waives.
"BCP-0004" = "claimed"
"BCP-0073" = "claimed"
"BCP-0098" = "claimed"
# §5.2 and §5.5: duties of a specification and its owner when defining a profile.
