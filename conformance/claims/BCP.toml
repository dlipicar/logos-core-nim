# Claim status of each section of spec-module-system-bcp.md.
# The longest matching section key wins (§4 covers §4.1 and §4/Unnumbered); `default` covers the rest.
#   claimed               every requirement unit in it needs a test tagged [BCP-NNNN]
#   deferred:tier-N       not built yet; N is the tier in docs/SPEC-STATUS.md
#   deferred:tier-4b      Tier 4b is closed (DECISIONS I97); no unit may carry this status
#   informative           no requirements to test
#   out-of-scope:<why>    normative, but not this repository's to implement

# logosd follows §5.1's bootstrap and publishes the §5.4 deployment document (docs/DEPLOYMENT.md;
# DECISIONS I97, G310). Every gated §5.4 unit is claimed under G309: by inspection where the
# document answers its item truthfully, none included, with tests where the answer is checked
# against the code (tests/test_deployment.nim); `spectrace deploydoc` keeps the two in step. No
# complete Logos module system is claimed (owner decision 10 (a); docs/CONFORMANCE.md "Properties
# not claimed"): a unit that is met is claimed whether or not the whole is (I97).
default = "claimed"

[sections]
"References" = "informative"
"Copyright" = "informative"

[units]
# The layer diagram and the consumer binding (Tier 4 step 8b). That optional logging never waives
# audit (BCP l.559) is descriptive at 6cac8335 (re-pin P6b).
"BCP-0004" = "claimed"
"BCP-0073" = "claimed"
