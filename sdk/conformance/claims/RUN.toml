# Claim status of each section of spec-module-runtime.md, for the SDK (`sdk/src/logos_sdk/`).
# The spec's ledger and its main claims file are core's (conformance/). Each unit is claimed by the
# package that implements its rule (restructure-in-place row 35, step R9): this file claims the units
# sdk implements, and gives every other unit core's status, with `claimed` there as
# `out-of-scope:core` here. `spectrace owners` checks that the two files agree and that each claimed
# unit's evidence is in its owner's tree; tools/restructure/claim_split.tsv records the split.
# The status vocabulary and the longest-match rule are as in the other file.

