# The layer map of tools/lint/layers.py. Paths are relative to the repository root; an entry
# ending in `/` covers a directory, any other names one file, and the longest entry wins. A file
# under src/ that no entry covers is core.

# `strict = true` accepts no exception and requires every layer to exist.
strict = true

# What generated kits and calls files import, and what none of it may reach (G339): the kit
# facade, and the runtimes a generated `_calls.nim` imports. Their closure reaches neither the
# Runtime Control types nor chronos (G335: a plain kit stays chronos-free).
kit_facade = [
  "sdk/src/logos_sdk/kit.nim",
  "sdk/src/logos_sdk/codegen/invokert.nim",
  "sdk/src/logos_sdk/codegen/consumert.nim",
]
kit_forbidden = [
  "sdk/src/logos_sdk/kit/rcclient.nim",
  "sdk/src/logos_sdk/kit/rc_types.nim",
]
# What generated thread-confined kits import (G335): chronos, but not the Runtime Control types.
confined_facade = ["sdk/src/logos_sdk/confined.nim"]

# The TLS engine, which stays out of logosd and logosctl. `transport/tls/signing` may be reached:
# the signing service belongs to the daemon.
daemon_tls_forbidden = [
  "src/logos_core/transport/tls/boring.nim",
  "src/logos_core/transport/tls/engine.nim",
]
# [Q2 (a), Tier 5 step 5-7a-1] Within that closure, the only modules that import the BoringSSL
# binding: `p256` signs and makes credentials with libcrypto and names no libssl function.
daemon_binding_importers = ["src/logos_core/transport/tls/p256.nim"]

# The core modules the daemon and the CLI may import directly, relative to src/logos_core/.
daemon_allowlist = [
  "authority/scopes",
  "crypto/slhdsa",
  "durable",
  "loader/contract",
  "orchestration",
  "orchestration/needs",
  "orchestration/settings",
  "package/trustdoc",
  "permissions",
  # [G491, Tier 5 step 5-6a-1] PM App A from the pinned documents: the composed Package Manager
  # instance's primary contract
  "pm/contractset",
  "pm/input",
  # [G410, G411, Tier 5 step 5-7a-1] the remote control channel: logosd's signing service and the
  # key holder answer on it
  "remote/carrier",
  "runtime/authscopes",
  "runtime/bell",
  "runtime/engine",
  "runtime/evidence",
  "runtime/host",
  "runtime/host_config",
  # [I147, Tier 5 step 5-6a-2] the one declaration of hostspawn.c's spawn, for the key holder's
  # spawn (daemon/remoteside): a copy of its own fell behind G492's parameter
  "runtime/hostsup",
  "runtime/plumbing",
  "runtime/stateadmin",
  "runtime/store",
  "transport/io/peercred",
  "transport/io/sock",
  # [G408, Tier 5 step 5-7a-1] the remote trust input: anchors checked with libcrypto, and the
  # snapshot the tls-tcp verifier takes
  "transport/tls/p256",
  "transport/tls/signing",
  "transport/tls/trustsnap",
  "transport/tls/x509",
]

# Besides the test trees, what may import logos_sdk/testing.
testing_importers = ["tools/regen_nim.nim", "tools/check_installs.nim"]

# The Package Manager (DECISIONS G406): its sources, and the external packages their import
# closure may reach, the set it reached when it was built (Tier 5 step 5-3b): results and zlib
# for the engine, and chronos for the shell (5-3b-2), whose confined kit runs chronos (G335).
# Any other package fails, so a storage library cannot arrive under a name nostorage.toml does not
# know. An entry nothing reaches is stale.
pm_roots = ["src/logos_core/pm/", "src/logos_core/package/"]
pm_external_allowlist = ["chronos", "results", "zlib"]

[layers]
sdk_base = ["sdk/src/logos_sdk/"]
sdk_binding = [
  "sdk/src/logos_sdk.nim",
  "sdk/src/logos_sdk/kit.nim",
  "sdk/src/logos_sdk/confined.nim",
  "sdk/src/logos_sdk/codegen/",
  "sdk/src/logos_sdk/contracts/",
  "sdk/src/logos_sdk/kit/",
  "sdk/src/lcn_gen.nim",
]
sdk_testing = ["sdk/src/logos_sdk/testing/"]
sdk_tests = ["sdk/tests/"]
daemon_cli = [
  "src/logos_core/daemon/",
  "src/logos_core/cli/",
  "src/logosd.nim",
  "src/logosctl.nim",
  "src/logos_keyholder.nim",
  "src/lcn_call.nim",
]
