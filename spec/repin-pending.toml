# against the frozen list spec/repin-baseline.toml. `spectrace pending` checks this file, and the file holds [deferred] only
# (DECISIONS I104, note at re-pin P9):
#
#   [deferred]   unit = the work item that owns it after the re-pin. Its claims file defers it by name, in [units],
#                and the unit is a live gated requirement. Or a text entry that rides on a deferred unit (same spec
#                and section, or a spec and section its sentence names, and the same work item), with a [[deferred]]
#                record in spec/repin-text-cleared.toml naming the unit and a decision row (DECISIONS I108)
#
# A unit whose claims file still defers it stays here. A unit of the frozen list's [deferred] leaves only claimed;
# any other unit the re-pin tracked leaves claimed, or with another status named in its claims file and a decision
# row that names it. A claimed unit needs a test that can run or an inspection item with a reason. A text entry
# leaves when a test of its unit carries its tag: its [[text]] record in spec/repin-text-cleared.toml gives id,
# step (the work item) and test (the suite).

