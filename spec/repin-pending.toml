[[text]]
id = "TXT-0275"
step = "P8"
spec = "RUN"
line = "90"
side = "new"
section = "Abstract/Terminology"
class = "todo"
what = "**Module provider:** The Runtime-known, route-facing exposure of schema-defined method or event behavior from a module instance. One provider record may expose the module's primary concrete contract, exact implemented interface contract views, and exact extended contract views. Every route selects exactly one of those contracts. A local provider is backed by a local module instance. A remote module facade is a local provider record that represents a module instance owned by another Runtime. A provider does not introduce a separate module implementation or lifecycle."

