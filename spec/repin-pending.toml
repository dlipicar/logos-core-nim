# The re-pin to logos-lips 6cac8335: what still follows the previous text (tier5-plans/repin-6cac8335.md §2).
#
# Generated at P0, then only ever shrunk by hand. `spectrace mirror`, `pins`, `gate` and `deploydoc` accept a
# difference listed here and fail on a listed item that no longer differs; `spectrace pending` checks the list.
#
#   [mirror], [pin]   item = sub-step that moves the mirror, the pin and the parser together
#   [units.added], [units.changed]
#                     unit = sub-step. A listed unit counts as deferred:tier-5 until the sub-step claims it,
#                     with a test or an inspection item, or moves it to [deferred] and names its owner
#   [stale]           retired id still cited = sub-step that removes the citation
#   [deploydoc]       unit whose row in docs/DEPLOYMENT.md is still missing = sub-step
#   [[text]]          a changed sentence or table row with no gated unit. class "behaviour" is cleared by a test
#                     tagged [TXT-nnnn]; class "todo" is read by its sub-step, which either treats it as behaviour
#                     or records what it compared and why it changes nothing; `guard` entries also name the test or
#                     code site that was read. A cleared entry moves to spec/repin-text-cleared.toml
#
# spec/repin-baseline.toml is the frozen copy of this list. An entry leaves only with its evidence, and changes
# sub-step only with a [[moved]] record in spec/repin-text-cleared.toml.
#   [deferred]        unit that stays deferred past the re-pin = the work item that owns it

closed = ["P1"]  # sub-steps that have merged; `spectrace pending` fails if one still owns an entry

[mirror]
"RNT/9.3.runtime-control.cddl" = "P4"
"RNT/9.3.7.runtime-enrollment.cddl" = "P4"
