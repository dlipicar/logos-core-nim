reading = "The sentence naming the extracted `logos_runtime_types.cddl` (TXT-0223) becomes one saying the block is the complete `logos.runtime` supporting schema. Our copy, RNT/9.2.runtime-types.cddl, is recomputed from that block alone, and the Runtime Control contract takes the `logos.runtime` types from it (§9.3.2); nothing defines another `logos.runtime` rule."
