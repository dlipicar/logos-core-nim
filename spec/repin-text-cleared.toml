compared = "The INTERFACE §5.2 listing, l.3432 at 6a4dfa28 against l.3373 at 6cac8335: revision `4u`, ABI version 3, `logos_publish_fn` returning `logos_error_code_t`, `observe_subscription_end` on both vtables, and the common section stated in full. `logos_types.h` is the listing copied; test_abi and test_kit compare every struct and mirror layout with it."

