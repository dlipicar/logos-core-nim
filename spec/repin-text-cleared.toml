# P3: wire, SubscriptionEnd, event delivery and the remote profiles -----------------------------------------------

[[units]]
id = "TRN-0016"
compared = "TRANSPORT §1.1 l.96 at 6a4dfa28 ('message-kind = 0..8') against l.84 at 6cac8335 ('0..9'): kind 9 is SubscriptionEnd. The §1.1 mirror and the pins are regenerated from the text; transport/envelope.nim gains mkSubscriptionEnd, which loadEnvelope checks against the pinned CDDL, and test_transport's kind-registry test accepts 9 and refuses 10."

[[units]]
id = "TRN-0040"
compared = "TRANSPORT §1.3 l.230 at 6a4dfa28 against l.220 at 6cac8335: the subscription-result-err rule is unchanged; the extracted text now ends in the comment that opens the new subscription-end rule. The §1.3 mirror is regenerated; the rule's tests in test_transport are unchanged."

[[units]]
id = "TRN-0045"
compared = "TRANSPORT §1.3 l.290 at 6a4dfa28 against l.290 at 6cac8335: the message union gains logos.transport.subscription-end. The envelope decodes and encodes it (decode typed by failureOf, toCbor with id and error); test_transport's samples carry one, which round-trips, fails with an extra field, a zero code and in the wrong direction."

[[units]]
id = "TRN-0125"
