compared = "INTERFACE §2 l.659 at 6a4dfa28 against l.627 at 6cac8335: the revision check compares with `4u`. CMappingRevision is 4, every generated header was regenerated, and test_codegen's revision-check test is tagged [TXT-0046] [TXT-0047]."

[[units]]
