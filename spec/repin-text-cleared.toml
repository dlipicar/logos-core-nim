reading = "'them' is named: route establishment and renewal. Modules reach both only through `establish_route` and `renew_route` (`establish` and `renew` in src/logos_core/runtime/engine.nim, served on the Runtime Control binding); nothing else establishes or renews a route."
compared = "RUNTIME l.3032 at 6cac8335 against l.3129 at 6a4dfa28."

[[text]]
