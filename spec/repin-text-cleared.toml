# What left spec/repin-pending.toml, and the evidence for each entry (DECISIONS I104).
#
#   [[text]]     a cleared sentence: `test` names the suite whose test carries [TXT-nnnn], or `reading`, `compared`
#                and `kind` record what was read. `kind`: reword, removed, informative or holds
#   [[units]]    what was compared for a changed unit, or the decision row of a unit that is not claimed
#   [[stale]]    what replaced a retired id's rule, or what became of its code
#   [[moved]]    an entry that changed sub-step, and why
#   [[lowered]]  a behaviour entry lowered by a decision row that names it

# P1: encoding ---------------------------------------------------------------------------------------------------

[[units]]
id = "CMT-0050"
compared = "COMMITMENT l.732 at 6a4dfa28 ('a different extracted mirror') against l.605 at 6cac8335 ('a different rule set'). The rule is wider, the code is unchanged: test_commitment recomputes every pinned root from the mirrored INTERFACE §5.1 text, and an imported common reference keeps the pinned registry roots when another common document is supplied."

[[units]]
id = "IFC-0920"
compared = "INTERFACE l.3139 at 6a4dfa28 (floating-point items only) against l.3090 at 6cac8335 (any value §4.4 item 5 prohibits). decodeCbor and checkPayload now refuse tags, null, undefined and other simple values too; test_transport, test_iface and test_cbor show each at the envelope and at the direct-mode boundary."

[[stale]]
id = "CDE-0056"
compared = "The rule refused only the four primitives as rule names. CDE-0213 replaces it with every RFC 8610 prelude name, enforced in cddl/canon.nim and now in cddl/codec.nim and oracle/cdcddle.py. The citation in test_cddl moved to CDE-0213."

[[stale]]
id = "IFC-0423"
compared = "The sentence that tags and null pass the envelope and fail at the schema is gone: they are Transport failures (IFC-0920). Forwarding without a schema remains at INTERFACE l.3092, which has no unit, so the test in test_transport keeps that behaviour and cites none. Invalid UTF-8 stays under TRN-0203."

[[stale]]
id = "IFC-0919"
compared = "The floats-only sentence is replaced by IFC-0976, which prohibits tags, floats, null, undefined and other simple values at any depth. The citations in test_cbor, test_iface and docs moved to IFC-0976."

[[moved]]
id = "TXT-0040"
from = "P1"
to = "P4"
reason = "Its replacement, TXT-0034 on provider-result validation in direct mode, is owned by P4, and P1 reads nothing of that path."

