site = "tests/test_permissions.nim"
named = "host-ambient stands for every facility class, claims no containment"
reading = "`applied` means the saved settings are enforced where the Runtime admits a use (`saApplied` in src/logos_core/runtime/settings.nim; `epRuntimeAdmission`, the only active enforcement point). The shipped permission definitions claim no containment (`containment` false in src/logos_core/permissions.nim), so `applied` claims none for code the execution path cannot restrict. The test shows host-ambient claiming no containment (G283, CA l.366)."
compared = "RUNTIME l.2477 at 6cac8335 (no sentence at 6a4dfa28), `saApplied` in src/logos_core/runtime/settings.nim and the definitions in src/logos_core/permissions.nim."

[[text]]
id = "TXT-0179"
step = "P4"
kind = "reword"
pair = "TXT-0246"
reading = "'acquires that route through the Runtime handle API' becomes 'obtains a route handle for that route through `materialize_route`'. That is the only way in the code: a same-process consumer materializes through its Runtime Control binding (`rcMaterializeOp`, then `materialize` on the Runtime thread). An out-of-process caller uses a local transport route (a hosted module); remote is 5-7a."
compared = "RUNTIME l.2916 at 6cac8335 against l.3006 at 6a4dfa28, and `rcMaterializeOp` in src/logos_core/runtime/bindings.nim."

[[text]]
id = "TXT-0181"
step = "P4"
kind = "reword"
pair = "TXT-0249"
reading = "The 'runtime API surface' is dropped from where authority inputs arrive. In the code they arrive only through Runtime Control methods and, on a transported route, through the ticket the session presents; `materialize_route` takes no authority input but the route id. Decisions are evaluated through the authority policy and kept per route as before."
compared = "RUNTIME l.2984 at 6cac8335 against l.3081 at 6a4dfa28, and `rcMaterializeOp` in src/logos_core/runtime/bindings.nim."

[[text]]
id = "TXT-0189"
