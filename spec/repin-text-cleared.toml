compared = "RUNTIME l.1416 at 6cac8335 against l.1489 at 6a4dfa28, and `establish` in src/logos_core/runtime/engine.nim with the tests 'all-runtime-visible and single selection' (partial and full `all` answers) and 'a single route to a ready provider' (no continuations) in tests/test_routes.nim."

[[text]]
id = "TXT-0151"
step = "P4"
kind = "holds"
site = "tests/test_observe.nim"
named = "a record the caller may not observe is omitted"
reading = "Observation authority is decided per record for the method or event that observes it: each observation method asks its own Runtime Control scope (`methodScope`), each event its own (`eventScope`), and a list method's allow is applied to each record with that record's selectors (`admits`). The test shows a record the caller may not observe omitted. This is G161's interim (TF-09), which the text now states, as G161's re-pin P4c bullet records."
compared = "RUNTIME l.1542 at 6cac8335 (no sentence at 6a4dfa28; G161 read l.3665 there), `methodScope` and `eventScope` in src/logos_core/runtime/observe.nim and `admits` in src/logos_core/runtime/engine.nim."

[[text]]
id = "TXT-0152"
step = "P4"
kind = "holds"
site = "tests/test_observe.nim"
named = "a record is shown only when one alternative admits it whole"
reading = "Under the Capability Authority a record is observable when one allow for the method or event carries a `runtime_control_scope` whose present constraints match the record: `admitsScope` accepts an allowed scope only when it covers the record's exact scope (G226). The test shows a record shown when one alternative covers it and hidden when none covers it whole."
compared = "RUNTIME l.1543 at 6cac8335 (no sentence at 6a4dfa28), and `admitsScope` and `subjectScope` in src/logos_core/runtime/observe.nim."

[[text]]
id = "TXT-0153"
step = "P4"
kind = "holds"
site = "tests/test_events.nim"
named = "activation and each delivery are decided by the authority through its cache"
reading = "Event subscription activation and event delivery join the list of operations that need an allow. A module event subscription is decided at activation (`subscribe-event`) and each delivery through the cached decision, decided afresh after `policy_changed`; a deny at delivery ends the subscription. Runtime Control events are decided the same way (G161, step 7b). The test shows the activation and each delivery decided by the authority."
compared = "RUNTIME l.1633 at 6cac8335, a list item added to the list at l.1720-1730 at 6a4dfa28, and the event authorization of G161 (step 7b) and G175."

[[text]]
id = "TXT-0154"
step = "P4"
kind = "reword"
pair = "TXT-0220"
reading = "'runtime API error channels' becomes 'Runtime Control binding error channels'. The binding operations that act outside a Runtime Control method answer an authority result in their own LogosResult: `rcMaterializeOp` (same-process `materialize_route`) answers NOT_AUTHORISED with no handle for another consumer's route or a used ticket, and `rcConnectRemoteOp` answers NOT_AUTHORISED for a Runtime it has no enrollment for. There is no other runtime API."
compared = "RUNTIME l.1655 at 6cac8335 against l.1750 at 6a4dfa28, and `rcMaterializeOp` and `rcConnectRemoteOp` in src/logos_core/runtime/bindings.nim with `materialize` in src/logos_core/runtime/engine.nim."

