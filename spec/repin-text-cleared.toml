[[text]]
id = "TXT-0165"
step = "P4"
kind = "holds"
site = "sdk/tests/test_rc_schema.nim"
named = "logos.runtime.route_id (§9.2"
reading = "`route_id` is `tstr .size (1..128)`: the schema test holds the `logos.runtime.route_id` rule in the §9.2 mirror. It is opaque and owned by the Runtime that allocates it: `newRouteId` makes 'route-', a 32-hex-digit prefix drawn per Runtime start and a counter (at most 59 bytes), never reused by that Runtime; `rcMaterializeOp` takes only 1 to 128 UTF-8 bytes. A consumer learns nothing from its form."
