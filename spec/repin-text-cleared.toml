[[text]]
id = "TXT-0361"
step = "P4"
kind = "holds"
site = "tests/test_runtime_authority.nim"
named = "a routed call naming another consumer"
reading = "A request naming a consumer other than the authenticated one is refused at the Runtime boundary before any evaluation: `authorityRefusal` answers NOT_AUTHORISED without dispatch, and `refusal` keeps it as `azRefused` with source `psBoundary`, neither a deny nor a failed evaluation. Nothing reaches the Capability Authority, so it writes no audit record. The test shows the refusal kept, while a matching call reaches the authority."
compared = "CAP l.94 at 6cac8335 (no sentence at 6a4dfa28), `authorityRefusal` in src/logos_core/runtime/invoke.nim and `refusal` in src/logos_core/runtime/engine.nim."

[[text]]
id = "TXT-0572"
step = "P4"
kind = "holds"
site = "sdk/tests/test_rc_schema.nim"
named = "the Runtime Control contract no longer defines or imports the enrollment records"
reading = "Read sentence by sentence: §9.3.1 to §9.3.16 keep old §9.3's sentences in order, split at paragraph breaks (one exception, §9.3.1/§9.3.2, which TXT-0164's named subject resolves). Each subsection opening names its subject, and each 'below', 'above', 'these' and 'this section' resolves in its own subsection or the one it names, except 'the in-flight call policy of this section' at l.3317 (§9.3.15) and l.3351 (§9.3.16), whose policy is l.3123 in §9.3.14 (TXT-0193, TXT-0262; an editorial remark, I108). The split the code depends on, the enrollment CDDL moved out of the Runtime Control contract into §9.3.7, the test shows."
compared = "RUNTIME §9.3 to §9.3.16 (l.1783-3355) at 6cac8335 against §9.3 (l.1888-3492) at 6a4dfa28, and the §9.3.2 and §9.3.7 entries of spec/mirrors.toml."

[[text]]
id = "TXT-0195"
step = "P4"
kind = "holds"
site = "tests/test_routes.nim"
named = "close_route's reason is diagnostic"
reading = "`closeRoute` never reads `reason`: nothing records it, sends it to the provider or lets it choose the outcome, which the authority decision, the route's existence, readiness and the route's state decide alone. [IMPL] The Runtime keeps no copy for observation or audit: no route record, event or audit field carries one at 6cac8335. The test closes one route with a reason and one without and gets the same answer but for the route id, then closes again with another reason and gets the same bytes, every route closed with no failure."
compared = "RUNTIME l.3353 at 6cac8335 (no sentence at 6a4dfa28), and `closeRoute` in src/logos_core/runtime/engine.nim."

[[text]]
id = "TXT-0199"
step = "P4"
kind = "holds"
site = "tests/test_observe.nim"
named = "a name-only selection needs an allow whose scope names no instance or provider"
reading = "A request that omits both selectors is decided first over its name scope, `modules: [name]` with no instances or providers (G161's interim, which l.3535 now states), and `admitsScope` takes an allowed scope only when it covers that scope whole (G226). So an allowed scope naming instances or providers refuses the name-only request: the Capability Authority may only narrow (CA l.565-567), and a narrower scope does not cover the name scope. Under the Capability Authority the test reads the name scope `get_readiness` asks for, `modules: [meter_module]` alone, and shows allows narrowed to the instance or to its provider refusing the name-only request while the instance one admits the exact selector."
compared = "RUNTIME l.3535 at 6cac8335 (no sentence at 6a4dfa28; l.3532-3534 kept), the name-scope decision in `selectLifecycle` (src/logos_core/runtime/engine.nim) and `admitsScope` in src/logos_core/runtime/observe.nim."

