pair = "TXT-0258"
reading = "'the existing route-revocation policy' becomes 'the in-flight call policy of this section'. §9.3.15 states no in-flight policy: the only one is l.3123 in §9.3.14 (profile or implementation policy), which was the same section before §9.3 was split, so the reading is that one (an editorial remark, I108). Ours is G174 and G260: a revoked route ends an admitted call NOT_AUTHORISED without committing its result, and a transported session answers in-flight Requests NOT_AUTHORISED, then closes. The sentence's case, a disabled listener or export, has no instance here: none can be enabled (G298)."
compared = "RUNTIME l.3317 at 6cac8335 against l.3459 at 6a4dfa28, l.3123 at 6cac8335, and `endRoute` in src/logos_core/runtime/engine.nim (G174, G260)."

