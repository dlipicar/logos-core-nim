# Spec blocks copied verbatim into spec/mirrors/. Code and tests read the copies,
# never hand-typed text. `spectrace mirror` fails when a copy no longer equals its
# block in the pinned spec; `spectrace mirror --write` refreshes them.
#
# A block is named by spec file, section key and the ordinal among blocks of the
# same fence language in that section, so line shifts elsewhere do not matter.
# ordinal = 0 joins every block of that language in the section, in order.

